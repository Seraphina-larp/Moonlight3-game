<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>那一束月光三</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600&display=swap');
  :root {
    --deep-blue: #0a0e2e; --gold: #c9a84c; --gold-light: #f0d080;
    --silver: #a8c0d6; --white: #f0f4ff;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--deep-blue); color: var(--white);
    font-family: 'Noto Serif TC', serif; min-height: 100vh;
    background-image:
      radial-gradient(ellipse at 20% 50%, rgba(26,42,108,0.8) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(123,184,232,0.15) 0%, transparent 50%);
  }
  body::before {
    content:''; position:fixed; top:0;left:0;right:0;bottom:0;
    background-image:
      radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 30% 8%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 50% 25%, rgba(255,255,255,0.7) 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 5%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 85% 18%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 20% 40%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 60% 35%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 40% 55%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 75% 60%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 15% 70%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 55% 75%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 35% 85%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 80% 80%, rgba(255,255,255,0.5) 0%, transparent 100%);
    pointer-events:none; z-index:0;
  }
  #app { position:relative; z-index:1; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:20px; }
  .title-header { text-align:center; padding:40px 20px 20px; animation:fadeIn 1.5s ease; }
  .title-header .subtitle { font-size:11px; letter-spacing:4px; color:var(--silver); text-transform:uppercase; margin-bottom:8px; }
  .title-header h1 { font-size:clamp(18px,4vw,32px); font-weight:300; color:var(--gold-light); letter-spacing:6px; text-shadow:0 0 30px rgba(201,168,76,0.5); }
  .screen { display:none; width:100%; max-width:900px; animation:fadeIn 0.8s ease; }
  .screen.active { display:block; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
  .section-title { text-align:center; font-size:14px; letter-spacing:3px; color:var(--gold); margin:30px 0 20px; }
  .character-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; padding:0 10px; }
  @media(max-width:600px){ .character-grid{grid-template-columns:repeat(2,1fr);} }
  .char-card { position:relative; border-radius:12px; overflow:hidden; cursor:pointer; border:2px solid transparent; transition:all 0.3s; aspect-ratio:3/4; background:rgba(255,255,255,0.05); }
  .char-card:hover { border-color:var(--gold); transform:translateY(-4px); box-shadow:0 8px 30px rgba(201,168,76,0.3); }
  .char-card.selected { border-color:var(--gold); box-shadow:0 0 30px rgba(201,168,76,0.5); }
  .char-card.taken { opacity:0.35; cursor:not-allowed; pointer-events:none; }
  .char-card img { width:100%; height:100%; object-fit:cover; display:block; }
  .char-name-overlay { position:absolute; bottom:0;left:0;right:0; background:linear-gradient(transparent,rgba(0,0,14,0.85)); padding:30px 12px 12px; text-align:center; }
  .char-name-overlay span { font-size:20px; font-weight:600; color:var(--white); letter-spacing:3px; text-shadow:0 2px 8px rgba(0,0,0,0.8); }
  .taken-badge { position:absolute;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--silver);letter-spacing:3px; }
  .name-input-section { text-align:center; margin:20px 0; }
  .name-input-section p { color:var(--silver); font-size:13px; letter-spacing:2px; margin-bottom:10px; }
  .styled-input { background:rgba(255,255,255,0.05); border:1px solid rgba(201,168,76,0.4); border-radius:8px; color:var(--white); font-family:'Noto Serif TC',serif; font-size:16px; padding:10px 20px; text-align:center; width:200px; outline:none; transition:border-color 0.3s; }
  .styled-input:focus { border-color:var(--gold); }
  .btn { display:inline-block; padding:12px 36px; border-radius:40px; border:none; cursor:pointer; font-family:'Noto Serif TC',serif; font-size:14px; letter-spacing:3px; transition:all 0.3s; }
  .btn-gold { background:linear-gradient(135deg,var(--gold),var(--gold-light)); color:var(--deep-blue); font-weight:600; box-shadow:0 4px 20px rgba(201,168,76,0.4); }
  .btn-gold:hover { transform:translateY(-2px); box-shadow:0 6px 30px rgba(201,168,76,0.6); }
  .btn-gold:disabled { opacity:0.4; cursor:not-allowed; transform:none; box-shadow:none; }
  .btn-center { display:flex; justify-content:center; margin:24px 0; }
  .waiting-container { text-align:center; padding:60px 20px; }
  .waiting-char-img { width:180px; height:240px; object-fit:cover; border-radius:12px; margin:0 auto 24px; display:block; border:2px solid rgba(201,168,76,0.4); box-shadow:0 0 40px rgba(201,168,76,0.2); }
  .waiting-char-name { font-size:28px; color:var(--gold-light); letter-spacing:6px; margin-bottom:8px; }
  .waiting-status { font-size:12px; color:var(--silver); letter-spacing:3px; animation:pulse 2s infinite; }
  .players-status { display:flex; justify-content:center; gap:12px; margin:30px 0; flex-wrap:wrap; }
  .player-dot { display:flex; flex-direction:column; align-items:center; gap:6px; }
  .player-dot .dot { width:10px; height:10px; border-radius:50%; background:rgba(255,255,255,0.2); transition:background 0.5s; }
  .player-dot .dot.online { background:#4ade80; box-shadow:0 0 8px rgba(74,222,128,0.6); }
  .player-dot .dot-label { font-size:10px; color:var(--silver); letter-spacing:1px; }
  .scoring-header { text-align:center; margin-bottom:30px; }
  .moment-title { font-size:clamp(20px,5vw,36px); color:var(--gold-light); letter-spacing:6px; margin-bottom:8px; text-shadow:0 0 20px rgba(240,208,128,0.4); }
  .moment-subtitle { font-size:12px; color:var(--silver); letter-spacing:3px; }
  .scoring-pair { display:flex; align-items:center; justify-content:center; gap:20px; margin:30px 0; flex-wrap:wrap; }
  .pair-char { text-align:center; }
  .pair-char img { width:100px; height:133px; object-fit:cover; border-radius:8px; border:2px solid rgba(201,168,76,0.3); }
  .pair-char .pair-name { font-size:14px; color:var(--silver); letter-spacing:2px; margin-top:6px; }
  .pair-char.self img { border-color:rgba(201,168,76,0.8); box-shadow:0 0 20px rgba(201,168,76,0.3); }
  .pair-char.self .pair-name { color:var(--gold); }
  .heart-icon { font-size:32px; color:var(--gold); flex-shrink:0; }
  .score-slider-container { text-align:center; margin:20px 0; padding:0 20px; }
  .score-label { font-size:clamp(48px,12vw,80px); color:var(--gold-light); font-weight:300; letter-spacing:4px; text-shadow:0 0 30px rgba(240,208,128,0.5); line-height:1; margin-bottom:16px; }
  .score-slider { -webkit-appearance:none; appearance:none; width:100%; max-width:400px; height:4px; border-radius:2px; outline:none; cursor:pointer; }
  .score-slider::-webkit-slider-thumb { -webkit-appearance:none; width:24px; height:24px; border-radius:50%; background:var(--gold-light); box-shadow:0 0 12px rgba(240,208,128,0.6); cursor:pointer; }
  .score-hint { font-size:11px; color:rgba(168,192,214,0.6); letter-spacing:2px; margin-top:10px; }
  .submitted-state { text-align:center; padding:40px 20px; animation:fadeIn 0.5s ease; }
  .submitted-state .big-score { font-size:72px; color:var(--gold-light); letter-spacing:4px; }
  .submitted-state .submitted-label { font-size:12px; color:var(--silver); letter-spacing:4px; margin-top:8px; animation:pulse 2s infinite; }

  /* Reveal screen - compare both scores */
  .reveal-container { text-align:center; padding:40px 20px; animation:fadeIn 0.8s ease; }
  .reveal-label { font-size:12px; color:var(--silver); letter-spacing:4px; margin-bottom:8px; }
  .reveal-moment { font-size:16px; color:var(--gold); letter-spacing:4px; margin-bottom:30px; }
  .reveal-compare { display:flex; align-items:center; justify-content:center; gap:20px; flex-wrap:wrap; }
  .rc-side { text-align:center; min-width:120px; }
  .rc-side img { width:90px; height:120px; object-fit:cover; border-radius:8px; border:2px solid rgba(201,168,76,0.3); display:block; margin:0 auto 8px; }
  .rc-name { font-size:14px; color:var(--gold); letter-spacing:2px; margin-bottom:4px; }
  .rc-gave-label { font-size:10px; color:var(--silver); letter-spacing:2px; margin-bottom:6px; }
  .rc-score { font-size:64px; color:var(--gold-light); font-weight:300; letter-spacing:2px; text-shadow:0 0 30px rgba(240,208,128,0.6); line-height:1; }
  .rc-score.partner-score { color:#a8d8f0; text-shadow:0 0 30px rgba(168,216,240,0.6); }
  .rc-score-sub { font-size:11px; color:rgba(168,192,214,0.5); letter-spacing:2px; margin-top:4px; }
  .rc-vs { font-size:28px; color:rgba(201,168,76,0.4); flex-shrink:0; }

  /* ===== MOON PARTY ===== */
  .moon-title { text-align:center; padding:30px 20px 10px; }
  .moon-title h2 { font-size:clamp(22px,5vw,36px); color:var(--gold-light); letter-spacing:6px; font-weight:300; text-shadow:0 0 20px rgba(240,208,128,0.4); }
  .moon-title p { font-size:12px; color:var(--silver); letter-spacing:3px; margin-top:8px; }

  .moon-options { display:flex; flex-direction:column; gap:14px; padding:20px; max-width:420px; margin:0 auto; }
  .moon-option {
    display:flex; align-items:center; gap:16px;
    padding:18px 24px; border-radius:16px; cursor:pointer;
    border:2px solid rgba(255,255,255,0.1);
    background:rgba(255,255,255,0.04);
    transition:all 0.3s ease; position:relative;
    user-select:none;
  }
  .moon-option:hover:not(.full):not(.mine) { border-color:rgba(201,168,76,0.5); background:rgba(201,168,76,0.08); transform:translateY(-2px); }
  .moon-option.mine { border-color:var(--gold); background:rgba(201,168,76,0.12); cursor:default; }
  .moon-option.full:not(.mine) { opacity:0.45; cursor:not-allowed; }
  .moon-option .moon-emoji { font-size:36px; flex-shrink:0; }
  .moon-option .moon-info { flex:1; }
  .moon-option .moon-name { font-size:18px; color:var(--white); letter-spacing:3px; }
  .moon-option .moon-count { font-size:11px; color:var(--silver); letter-spacing:2px; margin-top:3px; }
  .moon-option .moon-tag {
    position:absolute; right:16px; top:50%; transform:translateY(-50%);
    font-size:10px; letter-spacing:2px; padding:3px 10px; border-radius:20px;
  }
  .moon-option.mine .moon-tag { background:rgba(201,168,76,0.3); color:var(--gold); }
  .moon-option.full:not(.mine) .moon-tag { background:rgba(248,113,113,0.2); color:#f87171; }

  /* Dialogue screen */
  .dialogue-header { text-align:center; padding:24px 20px 16px; }
  .dialogue-moon { font-size:40px; margin-bottom:8px; }
  .dialogue-title { font-size:13px; color:var(--gold); letter-spacing:4px; }
  .dialogue-scroll { max-width:560px; margin:0 auto; padding:0 16px 40px; }
  .dialogue-bubble {
    margin-bottom:20px; animation:fadeIn 0.5s ease both;
  }
  .dialogue-bubble .db-speaker {
    font-size:11px; letter-spacing:3px; margin-bottom:6px;
    color:var(--silver);
  }
  .dialogue-bubble.is-me .db-speaker { color:var(--gold); }
  .dialogue-bubble .db-text {
    background:rgba(255,255,255,0.05);
    border-left:3px solid rgba(255,255,255,0.15);
    border-radius:0 10px 10px 0;
    padding:14px 16px;
    font-size:14px; line-height:1.9; color:var(--white);
    white-space:pre-wrap;
  }
  .dialogue-bubble.is-me .db-text {
    background:rgba(201,168,76,0.1);
    border-left-color:var(--gold);
    color:#fef3c7;
  }

  /* Love choice screen */
  .choice-btns { display:flex; flex-direction:column; align-items:center; gap:16px; margin:40px 0; }
  .choice-btns { display:flex; flex-direction:column; align-items:center; gap:16px; margin:40px 0; }
  .choice-btn {
    width: 260px; padding: 20px 0;
    border-radius: 50px; border: none; cursor: pointer;
    font-family: 'Noto Serif TC', serif; font-size: 20px; letter-spacing: 6px;
    transition: all 0.3s;
  }
  .choice-btn.stay {
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    color: var(--deep-blue); font-weight: 600;
    box-shadow: 0 4px 20px rgba(201,168,76,0.4);
  }
  .choice-btn.stay:hover { transform: translateY(-3px); box-shadow: 0 8px 30px rgba(201,168,76,0.6); }
  .choice-btn.leave {
    background: transparent;
    border: 2px solid rgba(248,113,113,0.6);
    color: #f87171;
  }
  .choice-btn.leave:hover { background: rgba(248,113,113,0.1); transform: translateY(-3px); }

  /* Love choice result */
  .lc-result-list { padding: 20px; max-width: 500px; margin: 0 auto; }
  .lc-result-item {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 20px; margin-bottom: 12px;
    background: rgba(255,255,255,0.04);
    border-radius: 12px;
    border-left: 3px solid transparent;
    animation: fadeIn 0.6s ease both;
  }
  .lc-result-item.stay { border-left-color: var(--gold); }
  .lc-result-item.leave { border-left-color: #f87171; }
  .lc-result-item img { width: 44px; height: 58px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
  .lc-result-item .lri-name { font-size: 16px; letter-spacing: 3px; color: var(--white); }
  .lc-result-item .lri-choice {
    margin-left: auto; font-size: 14px; letter-spacing: 3px;
    font-weight: 600;
  }
  .lc-result-item.stay .lri-choice { color: var(--gold-light); }
  .lc-result-item.leave .lri-choice { color: #f87171; }

  /* ECG screen */
  .ecg-container { padding:20px; text-align:center; }
  .ecg-title { font-size:16px; letter-spacing:4px; color:var(--gold); margin-bottom:6px; }
  .ecg-subtitle { font-size:12px; color:var(--silver); letter-spacing:2px; margin-bottom:30px; }
  canvas#ecgCanvas { background:rgba(255,255,255,0.03); border:1px solid rgba(201,168,76,0.2); border-radius:12px; max-width:100%; }
  .revealed-scores { display:flex; justify-content:center; gap:16px; margin:20px 0; flex-wrap:wrap; }
  .moment-score-chip { text-align:center; background:rgba(255,255,255,0.05); border:1px solid rgba(201,168,76,0.3); border-radius:10px; padding:10px 16px; min-width:70px; }
  .moment-score-chip .chip-moment { font-size:10px; color:var(--silver); letter-spacing:2px; margin-bottom:4px; }
  .moment-score-chip .chip-score { font-size:22px; color:var(--gold-light); }

  .divider { width:100%; height:1px; background:linear-gradient(to right,transparent,rgba(201,168,76,0.4),transparent); margin:20px 0; }
  #toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(20px); background:rgba(26,42,108,0.95); border:1px solid var(--gold); color:var(--gold-light); padding:12px 28px; border-radius:40px; font-size:13px; letter-spacing:2px; opacity:0; transition:all 0.4s; z-index:9999; pointer-events:none; }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app">
  <div class="title-header">
    <div class="subtitle">沙拉嘿喲・戀愛實驗所</div>
    <h1>那 一 束 月 光 三</h1>
  </div>

  <!-- 角色選擇 -->
  <div id="screen-select" class="screen active">
    <div class="name-input-section">
      <p>請輸入你的名字</p>
      <input type="text" id="playerNameInput" class="styled-input" placeholder="你的名字" maxlength="10">
    </div>
    <div class="section-title">選擇你的角色</div>
    <div class="character-grid" id="charGrid"></div>
    <div class="btn-center">
      <button class="btn btn-gold" id="confirmCharBtn" disabled onclick="confirmCharacter()">確認選擇</button>
    </div>
  </div>

  <!-- 等待 -->
  <div id="screen-waiting" class="screen">
    <div class="waiting-container">
      <img id="waitingCharImg" class="waiting-char-img" src="" alt="">
      <div class="waiting-char-name" id="waitingCharName"></div>
      <div class="divider"></div>
      <div class="players-status" id="playersStatus"></div>
      <div class="waiting-status" id="waitingStatusText">等待其他玩家加入...</div>
    </div>
  </div>

  <!-- 評分 -->
  <div id="screen-scoring" class="screen">
    <div class="scoring-header">
      <div class="moment-title" id="momentTitle">初遇時刻</div>
      <div class="moment-subtitle">為對方評分 · 1–100</div>
    </div>
    <div id="scoringContent"></div>
  </div>

  <!-- 公布：對方給我的分 -->
  <div id="screen-reveal" class="screen">
    <div class="reveal-container" id="revealContainer"></div>
  </div>

  <!-- 還能再愛嗎 選擇畫面 -->
  <div id="screen-lovechoice" class="screen">
    <div class="scoring-header">
      <div class="moment-title" id="lovechoiceTitle">還能再愛嗎？</div>
      <div class="moment-subtitle" id="lovechoiceRound"></div>
    </div>
    <div id="lovechoiceContent"></div>
  </div>

  <!-- 還能再愛嗎 公布畫面 -->
  <div id="screen-lovechoice-result" class="screen">
    <div class="scoring-header">
      <div class="moment-title">還能再愛嗎？</div>
      <div class="moment-subtitle" id="lovechoiceResultRound"></div>
    </div>
    <div id="lovechoiceResult"></div>
  </div>

  <!-- 滿月派對 選月相 -->
  <div id="screen-moonparty" class="screen">
    <div class="moon-title">
      <h2>滿 月 派 對</h2>
      <p>選擇你的房間 · 每間限兩人</p>
    </div>
    <div class="moon-options" id="moonOptions"></div>
  </div>

  <!-- 滿月派對 小劇場 -->
  <div id="screen-dialogue" class="screen">
    <div class="dialogue-header">
      <div class="dialogue-moon" id="dialogueMoon"></div>
      <div class="dialogue-title" id="dialogueTitle"></div>
    </div>
    <div class="dialogue-scroll" id="dialogueScroll"></div>
  </div>

  <!-- 心電圖（最終） -->
  <div id="screen-ecg" class="screen">
    <div class="ecg-container">
      <div class="ecg-title">愛情的心電圖</div>
      <div class="ecg-subtitle" id="ecgSubtitle">你的心跳軌跡</div>
      <canvas id="ecgCanvas" width="600" height="320"></canvas>
      <div class="revealed-scores" id="revealedScores"></div>
    </div>
  </div>
</div>
<div id="toast"></div>

<script type="module">

const BASE = "https://seraphina-larp.github.io/Moonlight3-game";
const CHARACTERS = {

  '李天樂': { img: BASE+'/%E6%9D%8E%E5%A4%A9%E6%A8%82.jpg', group:'B' },

  '杜綿':   { img: BASE+'/%E6%9D%9C%E7%B6%BF.jpg',   group:'C' },
  '周可一': { img: BASE+'/%E5%91%A8%E5%8F%AF%E4%B8%80.jpg', group:'A' },
  '劉白':   { img: BASE+'/%E5%8A%89%E7%99%BD.jpg',   group:'A' },
};
const PARTNERS = { '周可一':'劉白','劉白':'周可一','李天樂':'姜萊','姜萊':'李天樂','星群':'杜綿','杜綿':'星群' };
const MOMENTS = ['初遇時刻','告白時刻','相愛時刻','分手時刻','此刻'];

// ===== STATE =====
let myChar = null, myPlayerName = '', selectedChar = null;
let currentMomentIndex = -1;
let myScores = {};       // moment -> score I gave partner
let hasSubmittedThisMoment = false;
let _lastMomentForReset = -1;

// ===== SESSION RESTORE =====
// Save session to localStorage so reopening restores character
function saveSession() {
  if (myChar) localStorage.setItem('nl3_session', JSON.stringify({ char: myChar, name: myPlayerName }));
}
function loadSession() {
  try { return JSON.parse(localStorage.getItem('nl3_session')); } catch { return null; }
}

// ===== INIT =====
function initCharGrid() {
  const grid = document.getElementById('charGrid');
  grid.innerHTML = '';
  Object.entries(CHARACTERS).forEach(([name, data]) => {
    const card = document.createElement('div');
    card.className = 'char-card'; card.id = 'char_' + name;
    card.innerHTML = `<img src="${data.img}" alt="${name}" loading="lazy"><div class="char-name-overlay"><span>${name}</span></div>`;
    card.onclick = () => selectChar(name);
    grid.appendChild(card);
  });
}

function selectChar(name) {
  if (document.getElementById('char_' + name).classList.contains('taken')) return;
  document.querySelectorAll('.char-card').forEach(c => c.classList.remove('selected'));
  selectedChar = name;
  document.getElementById('char_' + name).classList.add('selected');
  document.getElementById('confirmCharBtn').disabled = false;
}

window.confirmCharacter = async function() {
  const name = document.getElementById('playerNameInput').value.trim();
  if (!name) { showToast('請輸入你的名字'); return; }
  if (!selectedChar) { showToast('請選擇角色'); return; }
  myPlayerName = name;
  const snap = await get(ref(db, 'players/' + selectedChar));
  if (snap.exists() && snap.val().online) {
    showToast('此角色已被選走'); return;
  }
  myChar = selectedChar;
  saveSession();
  // Read existing scores if any (resume scenario)
  if (snap.exists() && snap.val().scores) {
    myScores = snap.val().scores;
  }
  await set(ref(db, 'players/' + myChar), {
    name: myPlayerName, char: myChar, online: true,
    scores: myScores
  });
  enterGame();
};

async function tryResumeSession() {
  const session = loadSession();
  if (!session) return false;
  const snap = await get(ref(db, 'players/' + session.char));
  // Only resume if game is still active (players node exists)
  if (!snap.exists()) return false;
  myChar = session.char;
  myPlayerName = session.name;
  const data = snap.val();
  myScores = data.scores || {};
  // Mark back online
  await update(ref(db, 'players/' + myChar), { online: true, name: myPlayerName });
  enterGame();
  return true;
}

function enterGame() {
  document.getElementById('waitingCharImg').src = CHARACTERS[myChar].img;
  document.getElementById('waitingCharName').textContent = myChar;
  showScreen('screen-waiting');
  startListening();
}

// ===== LISTENERS =====
function startListening() {
  onValue(ref(db, 'players'), (snap) => {
    const players = snap.val() || {};
    updatePlayerDots(players);
    Object.keys(CHARACTERS).forEach(name => {
      const card = document.getElementById('char_' + name);
      if (!card) return;
      if (players[name] && players[name].online && name !== myChar) {
        card.classList.add('taken');
      }
    });
  });
  onValue(ref(db, 'gameState'), (snap) => {
    if (!snap.exists()) return;
    handleGameState(snap.val());
  });
  onValue(ref(db, 'gameState/momentIndex'), (snap) => {
    const idx = snap.val();
    if (idx !== null && idx !== undefined && idx !== _lastMomentForReset) {
      hasSubmittedThisMoment = false;
      _lastMomentForReset = idx;
    }
  });
}

function updatePlayerDots(players) {
  const container = document.getElementById('playersStatus');
  if (!container) return;
  container.innerHTML = '';
  Object.keys(CHARACTERS).forEach(name => {
    const div = document.createElement('div');
    div.className = 'player-dot';
    const isOnline = players[name] && players[name].online;
    div.innerHTML = `<div class="dot ${isOnline?'online':''}"></div><div class="dot-label">${name}</div>`;
    container.appendChild(div);
  });
  const onlineCount = Object.values(players).filter(p => p && p.online).length;
  const txt = document.getElementById('waitingStatusText');
  if (txt) txt.textContent = onlineCount >= 6 ? '所有玩家已就位，等待主持人開始...' : `等待其他玩家加入... (${onlineCount}/6)`;
}

// ===== GAME STATE HANDLER =====
function handleGameState(state) {
  const phase = state.phase || 'waiting';
  const momentIndex = state.momentIndex ?? -1;
  const locked = state.locked || false;
  const revealedGroup = state.revealedGroup || null;

  if (phase === 'closed') {
    localStorage.removeItem('nl3_session');
    myChar = null; myPlayerName = ''; selectedChar = null;
    myScores = {}; hasSubmittedThisMoment = false;
    initCharGrid();
    showScreen('screen-select');
    showToast('主持人已關閉遊戲');
    return;
  } else if (phase === 'waiting') {
    showScreen('screen-waiting');
  } else if (phase === 'scoring') {
    currentMomentIndex = momentIndex;
    const moment = MOMENTS[momentIndex];
    if (myScores[moment] !== undefined) hasSubmittedThisMoment = true;
    showScoringScreen(momentIndex, locked);
  } else if (phase === 'reveal') {
    showRevealScreen(state);
  } else if (phase === 'ecg') {
    showEcgScreen(revealedGroup, state);
  } else if (phase === 'moonparty') {
    showMoonPartyScreen(state);
  } else if (phase === 'moonparty_reveal') {
    showDialogueScreen(state);
  } else if (phase === 'lovechoice') {
    // Ch2: 還能再愛嗎 - voting
    showLoveChoiceScreen(state);
  } else if (phase === 'lovechoice_result') {
    // Ch2: reveal all choices
    showLoveChoiceResult(state);
  }
}

// ===== SCORING SCREEN =====
function showScoringScreen(momentIndex, locked) {
  showScreen('screen-scoring');
  const moment = MOMENTS[momentIndex];
  document.getElementById('momentTitle').textContent = moment;
  const partner = PARTNERS[myChar];
  const content = document.getElementById('scoringContent');
  if (locked || hasSubmittedThisMoment) {
    const score = myScores[moment] !== undefined ? myScores[moment] : '—';
    content.innerHTML = `<div class="submitted-state"><div class="big-score">${score}</div><div class="submitted-label">已送出 · 等待主持人公布</div></div>`;
    return;
  }
  const currentScore = myScores[moment] !== undefined ? myScores[moment] : 50;
  content.innerHTML = `
    <div class="scoring-pair">
      <div class="pair-char self"><img src="${CHARACTERS[myChar].img}" alt="${myChar}"><div class="pair-name">${myChar}</div></div>
      <div class="heart-icon">♡</div>
      <div class="pair-char"><img src="${CHARACTERS[partner].img}" alt="${partner}"><div class="pair-name">${partner}</div></div>
    </div>
    <div class="score-slider-container">
      <div class="score-label" id="scoreDisplay">${currentScore}</div>
      <input type="range" class="score-slider" id="scoreSlider" min="1" max="100" value="${currentScore}" oninput="updateSlider(this.value)">
      <div class="score-hint">拖動滑桿為對方評分</div>
    </div>
    <div class="btn-center">
      <button class="btn btn-gold" onclick="submitScore()">送出評分</button>
    </div>`;
  updateSliderBg(currentScore);
}

window.updateSlider = function(val) {
  document.getElementById('scoreDisplay').textContent = val;
  updateSliderBg(val);
};
function updateSliderBg(val) {
  const s = document.getElementById('scoreSlider');
  if (!s) return;
  const pct = (val-1)/99*100;
  s.style.background = `linear-gradient(to right, var(--gold) 0%, var(--gold) ${pct}%, rgba(255,255,255,0.2) ${pct}%, rgba(255,255,255,0.2) 100%)`;
}

window.submitScore = async function() {
  const val = parseInt(document.getElementById('scoreSlider').value);
  const moment = MOMENTS[currentMomentIndex];
  myScores[moment] = val;
  hasSubmittedThisMoment = true;
  await set(ref(db, `players/${myChar}/scores/${moment}`), val);
  const content = document.getElementById('scoringContent');
  content.innerHTML = `<div class="submitted-state"><div class="big-score">${val}</div><div class="submitted-label">已送出 · 等待主持人公布</div></div>`;
  showToast('評分已送出');
};

// ===== REVEAL SCREEN - show both scores =====
async function showRevealScreen(state) {
  const myGroup = CHARACTERS[myChar].group;
  const revealedGroup = state.revealedGroup || null;
  if (revealedGroup && revealedGroup !== 'all' && revealedGroup !== myGroup) {
    return;
  }
  const momentIndex = state.momentIndex ?? currentMomentIndex;
  const moment = MOMENTS[momentIndex];
  const partner = PARTNERS[myChar];

  // My score to partner
  const myScore = myScores[moment] !== undefined ? myScores[moment] : null;
  // Partner's score to me
  const snap = await get(ref(db, `players/${partner}/scores/${moment}`));
  const partnerScore = snap.exists() ? snap.val() : null;

  showScreen('screen-reveal');
  const container = document.getElementById('revealContainer');
  container.innerHTML = `
    <div class="reveal-label">互相評分對比</div>
    <div class="reveal-moment">${moment}</div>
    <div class="reveal-compare">
      <div class="rc-side">
        <img src="${CHARACTERS[myChar].img}" alt="${myChar}">
        <div class="rc-name">${myChar}</div>
        <div class="rc-gave-label">給 ${partner}</div>
        <div class="rc-score">${myScore !== null ? myScore : '—'}</div>
        <div class="rc-score-sub">/ 100</div>
      </div>
      <div class="rc-vs">↔</div>
      <div class="rc-side">
        <img src="${CHARACTERS[partner].img}" alt="${partner}">
        <div class="rc-name">${partner}</div>
        <div class="rc-gave-label">給 ${myChar}</div>
        <div class="rc-score partner-score">${partnerScore !== null ? partnerScore : '—'}</div>
        <div class="rc-score-sub">/ 100</div>
      </div>
    </div>
  `;
}

// ===== ECG SCREEN =====
function showEcgScreen(revealedGroup, state) {
  const myGroup = CHARACTERS[myChar].group;
  if (revealedGroup && revealedGroup !== 'all' && revealedGroup !== myGroup) {
    // Not my group - stay on reveal or waiting
    return;
  }
  showScreen('screen-ecg');
  document.getElementById('ecgSubtitle').textContent = myChar + ' 的愛情心跡';
  const revealedDiv = document.getElementById('revealedScores');
  revealedDiv.innerHTML = '';
  MOMENTS.forEach(m => {
    const score = myScores[m];
    if (score !== undefined) {
      const chip = document.createElement('div');
      chip.className = 'moment-score-chip';
      chip.innerHTML = `<div class="chip-moment">${m}</div><div class="chip-score">${score}</div>`;
      revealedDiv.appendChild(chip);
    }
  });
  drawEcg();
}

function drawEcg() {
  const canvas = document.getElementById('ecgCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0,0,W,H);
  // Grid
  ctx.strokeStyle='rgba(201,168,76,0.1)'; ctx.lineWidth=1;
  for(let i=0;i<=5;i++){const y=40+(H-80)*(i/5);ctx.beginPath();ctx.moveTo(50,y);ctx.lineTo(W-20,y);ctx.stroke();}
  for(let i=0;i<=4;i++){const x=50+(W-70)*(i/4);ctx.beginPath();ctx.moveTo(x,30);ctx.lineTo(x,H-30);ctx.stroke();}
  // Labels
  ctx.fillStyle='rgba(168,192,214,0.7)'; ctx.font='11px sans-serif'; ctx.textAlign='center';
  MOMENTS.forEach((m,i)=>{ctx.fillText(m.replace('時刻',''),50+(W-70)*(i/4),H-10);});
  ctx.textAlign='right';
  [0,25,50,75,100].forEach(v=>{ctx.fillText(v,44,40+(H-80)*((100-v)/100)+4);});
  // Points
  const pts = MOMENTS.map((m,i)=>{
    const s=myScores[m]??null; if(s===null)return null;
    return{x:50+(W-70)*(i/4),y:40+(H-80)*((100-s)/100),score:s};
  }).filter(Boolean);
  if(pts.length<2)return;
  // Wave line
  ctx.beginPath(); ctx.strokeStyle='#f0d080'; ctx.lineWidth=2.5;
  ctx.shadowColor='rgba(240,208,128,0.6)'; ctx.shadowBlur=8;
  ctx.moveTo(pts[0].x,pts[0].y);
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i],p1=pts[i+1],midX=(p0.x+p1.x)/2;
    const amp=Math.abs(p1.y-p0.y)*0.3+10;
    ctx.bezierCurveTo(midX-(midX-p0.x)*0.3,p0.y-amp,midX-(p1.x-midX)*0.3,p1.y-amp,p1.x,p1.y);
  }
  ctx.stroke(); ctx.shadowBlur=0;
  // Dots
  pts.forEach(p=>{
    ctx.beginPath();ctx.arc(p.x,p.y,5,0,Math.PI*2);
    ctx.fillStyle='#f0d080';ctx.shadowColor='rgba(240,208,128,0.8)';ctx.shadowBlur=12;ctx.fill();ctx.shadowBlur=0;
    ctx.fillStyle='rgba(240,208,128,0.9)';ctx.font='bold 14px sans-serif';ctx.textAlign='center';
    ctx.fillText(p.score,p.x,p.y-14);
  });
}

const MOON_PHASES = [
  { key: 'waxing', emoji: '🌙', name: '上弦月' },
  { key: 'full',   emoji: '🌕', name: '滿月' },
  { key: 'waning', emoji: '🌗', name: '下弦月' },
];

let moonPartyRound = 1;
let myMoonChoice = null;
let moonUnsubscribe = null;

function showMoonPartyScreen(state) {
  moonPartyRound = state.mpRound || 1;
  showScreen('screen-moonparty');
  // Listen to moon selections live
  if (moonUnsubscribe) moonUnsubscribe();
  moonUnsubscribe = onValue(ref(db, `moonParty/round${moonPartyRound}`), (snap) => {
    const selections = snap.val() || {};
    // Restore my choice if I had one
    if (!myMoonChoice) {
      Object.entries(selections).forEach(([phase, players]) => {
        if (players && players[myChar]) myMoonChoice = phase;
      });
    }
    renderMoonOptions(selections);
  });
}

function renderMoonOptions(selections) {
  const container = document.getElementById('moonOptions');
  container.innerHTML = '';
  MOON_PHASES.forEach(phase => {
    const players = selections[phase.key] || {};
    const count = Object.keys(players).filter(k => players[k]).length;
    const isMine = myMoonChoice === phase.key;
    const isFull = count >= 2 && !isMine;

    const div = document.createElement('div');
    div.className = 'moon-option' + (isMine ? ' mine' : '') + (isFull ? ' full' : '');

    let tagHTML = '';
    if (isMine) tagHTML = '<span class="moon-tag">已選擇</span>';
    else if (isFull) tagHTML = '<span class="moon-tag">已額滿</span>';

    div.innerHTML = `
      <div class="moon-emoji">${phase.emoji}</div>
      <div class="moon-info">
        <div class="moon-name">${phase.name}</div>
        <div class="moon-count">${count} / 2 人</div>
      </div>
      ${tagHTML}
    `;

    if (!isMine && !isFull) {
      div.onclick = () => chooseMoonPhase(phase.key, phase.name);
    } else if (isFull && !isMine) {
      div.onclick = () => showToast('此房間已額滿，請選擇其他房間');
    }
    container.appendChild(div);
  });
}

async function chooseMoonPhase(phaseKey, phaseName) {
  if (!confirm(`確定選擇「${phaseName}」嗎？`)) return;

  // Check capacity again before saving
  const snap = await get(ref(db, `moonParty/round${moonPartyRound}/${phaseKey}`));
  const existing = snap.exists() ? snap.val() : {};
  const count = Object.keys(existing).filter(k => existing[k]).length;
  if (count >= 2) {
    showToast('此房間已額滿，請選擇其他房間');
    return;
  }

  // Remove previous choice if any
  if (myMoonChoice && myMoonChoice !== phaseKey) {
    await set(ref(db, `moonParty/round${moonPartyRound}/${myMoonChoice}/${myChar}`), null);
  }

  myMoonChoice = phaseKey;
  await set(ref(db, `moonParty/round${moonPartyRound}/${phaseKey}/${myChar}`), true);
  showToast(`已選擇 ${phaseName}`);
}

async function showDialogueScreen(state) {
  const phase = state.mpRevealPhase;
  const round = state.mpRound || 1;

  // Find my roommate
  const snap = await get(ref(db, `moonParty/round${round}/${phase}`));
  const players = snap.exists() ? snap.val() : {};
  const roommates = Object.keys(players).filter(k => players[k]);

  if (roommates.length < 2 || !roommates.includes(myChar)) {
    // I'm not in this room, stay on moon party screen
    return;
  }

  const partner = roommates.find(r => r !== myChar);
  const key = [myChar, partner].sort().join('_');
  const dialogue = DIALOGUES[key];

  const moonPhase = MOON_PHASES.find(m => m.key === phase);
  showScreen('screen-dialogue');
  document.getElementById('dialogueMoon').textContent = moonPhase ? moonPhase.emoji : '🌕';
  document.getElementById('dialogueTitle').textContent = `${myChar}  ×  ${partner}`;

  const scroll = document.getElementById('dialogueScroll');
  if (!dialogue) {
    scroll.innerHTML = '<div style="text-align:center;color:var(--silver);padding:40px;">小劇場準備中...</div>';
    return;
  }

  scroll.innerHTML = '';
  dialogue.forEach((line, i) => {
    const isMe = line.s === myChar;
    const div = document.createElement('div');
    div.className = 'dialogue-bubble' + (isMe ? ' is-me' : '');
    div.style.animationDelay = (i * 0.08) + 's';
    div.innerHTML = `<div class="db-speaker">【${line.s}】</div><div class="db-text">${line.t.replace(/\n/g, '<br><br>')}</div>`;
    scroll.appendChild(div);
  });
}

// ===== LOVE CHOICE (還能再愛嗎) =====
const ROUND_LABELS = { 1: '第一次', 2: '第二次', 3: '第三次' };

function showLoveChoiceScreen(state) {
  const round = state.lcRound || 1;
  const locked = state.locked || false;
  showScreen('screen-lovechoice');
  document.getElementById('lovechoiceTitle').textContent = '還能再愛嗎？';
  document.getElementById('lovechoiceRound').textContent = ROUND_LABELS[round] + ' · 做出你的選擇';

  const content = document.getElementById('lovechoiceContent');

  // Check if already submitted this round
  const myChoice = state.lcChoices && state.lcChoices[myChar];
  if (myChoice || locked) {
    content.innerHTML = `
      <div class="submitted-state">
        <div class="big-score" style="font-size:36px;letter-spacing:6px;">${myChoice === 'stay' ? '不 分 手' : myChoice === 'leave' ? '分 手' : '—'}</div>
        <div class="submitted-label">已送出 · 等待主持人公布</div>
      </div>`;
    return;
  }

  content.innerHTML = `
    <div class="choice-btns">
      <button class="choice-btn stay" onclick="submitLoveChoice('stay', ${round})">不 分 手</button>
      <button class="choice-btn leave" onclick="submitLoveChoice('leave', ${round})">分 手</button>
    </div>`;
}

window.submitLoveChoice = async function(choice, round) {
  const label = choice === 'stay' ? '不分手' : '分手';
  if (!confirm(`確定選擇「${label}」嗎？`)) return;

  // Save to Firebase under lcRound-specific key
  await set(ref(db, `loveChoices/round${round}/${myChar}`), choice);

  // Also update gameState lcChoices for live display
  await update(ref(db, `gameState/lcChoices`), { [myChar]: choice });

  const content = document.getElementById('lovechoiceContent');
  content.innerHTML = `
    <div class="submitted-state">
      <div class="big-score" style="font-size:36px;letter-spacing:6px;">${label}</div>
      <div class="submitted-label">已送出 · 等待主持人公布</div>
    </div>`;
  showToast('選擇已送出');
};

async function showLoveChoiceResult(state) {
  const round = state.lcRound || 1;
  const revealedGroup = state.revealedGroup || null;
  showScreen('screen-lovechoice-result');
  document.getElementById('lovechoiceResultRound').textContent = ROUND_LABELS[round];

  // Fetch all choices for this round
  const snap = await get(ref(db, `loveChoices/round${round}`));
  const choices = snap.exists() ? snap.val() : {};

  const ORDER = ['姜萊','李天樂','周可一','劉白','星群','杜綿'];
  const result = document.getElementById('lovechoiceResult');
  result.innerHTML = '<div class="lc-result-list">' +
    ORDER.map((name, i) => {
      const c = choices[name];
      const label = c === 'stay' ? '不 分 手' : c === 'leave' ? '分 手' : '待定';
      const cls = c === 'stay' ? 'stay' : c === 'leave' ? 'leave' : '';
      return `<div class="lc-result-item ${cls}" style="animation-delay:${i*0.12}s">
        <img src="${CHARACTERS[name].img}" alt="${name}">
        <div class="lri-name">${name}</div>
        <div class="lri-choice">${label}</div>
      </div>`;
    }).join('') +
  '</div>';
}

// ===== HELPERS =====
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function showToast(msg) {
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

// ===== BOOT =====
initCharGrid();
// Try to resume session first
tryResumeSession().then(resumed => {
  if (!resumed) {
    // Normal flow - show character select
    showScreen('screen-select');
  }
});

window.addEventListener('beforeunload', () => {
  if (myChar) update(ref(db, `players/${myChar}`), { online: false });
});
</script>
