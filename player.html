<meta name="mobile-web-app-capable" content="yes">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600&display=swap');
  :root {
    --deep-blue: #0a0e2e; --gold: #c9a84c; --gold-light: #f0d080;
    --silver: #a8c0d6; --white: #f0f4ff;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--deep-blue); color: var(--white);
    font-family: 'Noto Serif TC', serif; min-height: 100vh;
    background-image:
      radial-gradient(ellipse at 20% 50%, rgba(26,42,108,0.8) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(123,184,232,0.15) 0%, transparent 50%);
  }
  body::before {
    content:''; position:fixed; top:0;left:0;right:0;bottom:0;
    background-image:
      radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 30% 8%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 50% 25%, rgba(255,255,255,0.7) 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 5%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 85% 18%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 20% 40%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 60% 35%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 40% 55%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 75% 60%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 15% 70%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 55% 75%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 35% 85%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 80% 80%, rgba(255,255,255,0.5) 0%, transparent 100%);
    pointer-events:none; z-index:0;
  }
  #app { position:relative; z-index:1; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:20px; }
  .title-header { text-align:center; padding:40px 20px 20px; animation:fadeIn 1.5s ease; }
  .title-header .subtitle { font-size:11px; letter-spacing:4px; color:var(--silver); text-transform:uppercase; margin-bottom:8px; }
  .title-header h1 { font-size:clamp(18px,4vw,32px); font-weight:300; color:var(--gold-light); letter-spacing:6px; text-shadow:0 0 30px rgba(201,168,76,0.5); }
  .screen { display:none; width:100%; max-width:900px; animation:fadeIn 0.8s ease; }
  .screen.active { display:block; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
  .section-title { text-align:center; font-size:14px; letter-spacing:3px; color:var(--gold); margin:30px 0 20px; }
  .character-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; padding:0 10px; }
  @media(max-width:600px){ .character-grid{grid-template-columns:repeat(2,1fr);} }
  .char-card { position:relative; border-radius:12px; overflow:hidden; cursor:pointer; border:2px solid transparent; transition:all 0.3s; aspect-ratio:3/4; background:rgba(255,255,255,0.05); }
  .char-card:hover { border-color:var(--gold); transform:translateY(-4px); box-shadow:0 8px 30px rgba(201,168,76,0.3); }
  .char-card.selected { border-color:var(--gold); box-shadow:0 0 30px rgba(201,168,76,0.5); }
  .char-card.taken { opacity:0.35; cursor:not-allowed; pointer-events:none; }
  .char-card img { width:100%; height:100%; object-fit:cover; display:block; }
  .char-name-overlay { position:absolute; bottom:0;left:0;right:0; background:linear-gradient(transparent,rgba(0,0,14,0.85)); padding:30px 12px 12px; text-align:center; }
  .char-name-overlay span { font-size:20px; font-weight:600; color:var(--white); letter-spacing:3px; text-shadow:0 2px 8px rgba(0,0,0,0.8); }
  .taken-badge { position:absolute;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--silver);letter-spacing:3px; }
  .name-input-section { text-align:center; margin:20px 0; }
  .name-input-section p { color:var(--silver); font-size:13px; letter-spacing:2px; margin-bottom:10px; }
  .styled-input { background:rgba(255,255,255,0.05); border:1px solid rgba(201,168,76,0.4); border-radius:8px; color:var(--white); font-family:'Noto Serif TC',serif; font-size:16px; padding:10px 20px; text-align:center; width:200px; outline:none; transition:border-color 0.3s; }
  .styled-input:focus { border-color:var(--gold); }
  .btn { display:inline-block; padding:12px 36px; border-radius:40px; border:none; cursor:pointer; font-family:'Noto Serif TC',serif; font-size:14px; letter-spacing:3px; transition:all 0.3s; }
  .btn-gold { background:linear-gradient(135deg,var(--gold),var(--gold-light)); color:var(--deep-blue); font-weight:600; box-shadow:0 4px 20px rgba(201,168,76,0.4); }
  .btn-gold:hover { transform:translateY(-2px); box-shadow:0 6px 30px rgba(201,168,76,0.6); }
  .btn-gold:disabled { opacity:0.4; cursor:not-allowed; transform:none; box-shadow:none; }
  .btn-center { display:flex; justify-content:center; margin:24px 0; }
  .waiting-container { text-align:center; padding:60px 20px; }
  .waiting-char-img { width:180px; height:240px; object-fit:cover; border-radius:12px; margin:0 auto 24px; display:block; border:2px solid rgba(201,168,76,0.4); box-shadow:0 0 40px rgba(201,168,76,0.2); }
  .waiting-char-name { font-size:28px; color:var(--gold-light); letter-spacing:6px; margin-bottom:8px; }
  .waiting-status { font-size:12px; color:var(--silver); letter-spacing:3px; animation:pulse 2s infinite; }
  .players-status { display:flex; justify-content:center; gap:12px; margin:30px 0; flex-wrap:wrap; }
  .player-dot { display:flex; flex-direction:column; align-items:center; gap:6px; }
  .player-dot .dot { width:10px; height:10px; border-radius:50%; background:rgba(255,255,255,0.2); transition:background 0.5s; }
  .player-dot .dot.online { background:#4ade80; box-shadow:0 0 8px rgba(74,222,128,0.6); }
  .player-dot .dot-label { font-size:10px; color:var(--silver); letter-spacing:1px; }
  .scoring-header { text-align:center; margin-bottom:30px; }
  .moment-title { font-size:clamp(20px,5vw,36px); color:var(--gold-light); letter-spacing:6px; margin-bottom:8px; text-shadow:0 0 20px rgba(240,208,128,0.4); }
  .moment-subtitle { font-size:12px; color:var(--silver); letter-spacing:3px; }
  .scoring-pair { display:flex; align-items:center; justify-content:center; gap:20px; margin:30px 0; flex-wrap:wrap; }
  .pair-char { text-align:center; }
  .pair-char img { width:100px; height:133px; object-fit:cover; border-radius:8px; border:2px solid rgba(201,168,76,0.3); }
  .pair-char .pair-name { font-size:14px; color:var(--silver); letter-spacing:2px; margin-top:6px; }
  .pair-char.self img { border-color:rgba(201,168,76,0.8); box-shadow:0 0 20px rgba(201,168,76,0.3); }
  .pair-char.self .pair-name { color:var(--gold); }
  .heart-icon { font-size:32px; color:var(--gold); flex-shrink:0; }
  .score-slider-container { text-align:center; margin:20px 0; padding:0 20px; }
  .score-label { font-size:clamp(48px,12vw,80px); color:var(--gold-light); font-weight:300; letter-spacing:4px; text-shadow:0 0 30px rgba(240,208,128,0.5); line-height:1; margin-bottom:16px; }
  .score-slider { -webkit-appearance:none; appearance:none; width:100%; max-width:400px; height:4px; border-radius:2px; outline:none; cursor:pointer; }
  .score-slider::-webkit-slider-thumb { -webkit-appearance:none; width:24px; height:24px; border-radius:50%; background:var(--gold-light); box-shadow:0 0 12px rgba(240,208,128,0.6); cursor:pointer; }
  .score-hint { font-size:11px; color:rgba(168,192,214,0.6); letter-spacing:2px; margin-top:10px; }
  .submitted-state { text-align:center; padding:40px 20px; animation:fadeIn 0.5s ease; }
  .submitted-state .big-score { font-size:72px; color:var(--gold-light); letter-spacing:4px; }
  .submitted-state .submitted-label { font-size:12px; color:var(--silver); letter-spacing:4px; margin-top:8px; animation:pulse 2s infinite; }

  /* Reveal screen - compare both scores */
  .reveal-container { text-align:center; padding:40px 20px; animation:fadeIn 0.8s ease; }

  .travel-header p { font-size:12px; color:var(--silver); letter-spacing:3px; margin-top:8px; }

  .travel-options { display:flex; flex-direction:column; gap:14px; padding:20px; max-width:440px; margin:0 auto; }

    padding:20px 24px; border-radius:16px; cursor:pointer;

    background:rgba(255,255,255,0.04);
    transition:all 0.3s; text-align:center;

  .travel-option:hover:not(.fixed-only) { border-color:var(--gold); background:rgba(201,168,76,0.08); transform:translateY(-2px); }
  .travel-option.selected { border-color:var(--gold); background:rgba(201,168,76,0.12); cursor:default; }

  .travel-waiting { text-align:center; padding:40px 20px; animation:fadeIn 0.5s ease; }

  .travel-waiting .tw-status { font-size:12px; color:var(--silver); letter-spacing:3px; animation:pulse 2s infinite; }

  .travel-text-screen { max-width:580px; margin:0 auto; padding:0 16px 40px; }
  .travel-text-title { text-align:center; padding:24px 0 20px; }
  .travel-text-title .tt-chapter { font-size:11px; color:var(--silver); letter-spacing:4px; margin-bottom:6px; }
  .travel-text-title .tt-pair { font-size:16px; color:var(--gold); letter-spacing:4px; }
  .travel-text-body {
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(201,168,76,0.15);
    border-radius:12px;
    padding:24px 20px;
    font-size:15px; line-height:1.9; color:var(--white);
    white-space:pre-wrap;
  }

  /* ===== FINAL CHOICE ===== */
  .final-title { text-align:center; padding:30px 20px 16px; }
  .final-title h2 { font-size:clamp(22px,5vw,34px); color:var(--gold-light); letter-spacing:8px; font-weight:300; text-shadow:0 0 20px rgba(240,208,128,0.5); }
  .final-title p  { font-size:12px; color:var(--silver); letter-spacing:3px; margin-top:8px; }

  .final-options { display:flex; flex-direction:column; gap:14px; padding:24px; max-width:400px; margin:0 auto; }
  .final-option {
    display:flex; align-items:center; gap:16px;
    padding:18px 24px; border-radius:50px;
    cursor:pointer; transition:all 0.3s;
    font-family:'Noto Serif TC',serif;
    font-size:17px; letter-spacing:4px;
    border:2px solid transparent;
  }
  .final-option.person {
    background:linear-gradient(135deg,rgba(201,168,76,0.15),rgba(240,208,128,0.08));
    border-color:rgba(201,168,76,0.4); color:var(--gold-light);
  }
  .final-option.person:hover:not(.selected) { border-color:var(--gold); background:rgba(201,168,76,0.25); transform:translateY(-3px); box-shadow:0 8px 30px rgba(201,168,76,0.3); }
  .final-option.solo {

  .final-option.selected { opacity:0.7; cursor:default; transform:none; }
  .final-option .fo-icon { font-size:22px; flex-shrink:0; }

  .ending-bubble { margin-bottom:22px; animation:fadeIn 0.6s ease both; }
  .ending-bubble .eb-speaker {
    font-size:11px; letter-spacing:3px; margin-bottom:6px;

  .ending-bubble.is-me .eb-speaker { color:var(--gold); }

  .ending-bubble .eb-text {

  .no-match-text { font-size:16px; color:var(--silver); letter-spacing:3px; line-height:2; }

  .journey-intro { text-align: center; margin-bottom: 30px; }

  .journey-options { display: flex; flex-direction: column; gap: 14px; }

    background: rgba(255,255,255,0.04);
    transition: all 0.3s ease;

  .journey-option:hover:not(.selected):not(.locked) {

  .journey-option.only-option { cursor: default; border-color: rgba(255,255,255,0.05); }

  .journey-submitted { text-align: center; padding: 20px; animation: fadeIn 0.5s ease; }

  .journey-submitted .js-label { font-size: 11px; color: var(--silver); letter-spacing: 3px; animation: pulse 2s infinite; }

  .journey-story-label { font-size: 11px; color: var(--silver); letter-spacing: 4px; margin-bottom: 6px; }
  .journey-story-pair { font-size: 15px; color: var(--gold); letter-spacing: 4px; margin-bottom: 4px; }
  .journey-story-type { font-size: 11px; color: rgba(168,192,214,0.6); letter-spacing: 3px; }
  .journey-story-scroll { max-width: 560px; margin: 0 auto; padding: 0 16px 60px; }
  .journey-story-text {
    font-size: 15px; line-height: 2; color: var(--white);
    white-space: pre-wrap;
    background: rgba(255,255,255,0.03);
    border-left: 3px solid rgba(201,168,76,0.3);
    border-radius: 0 10px 10px 0;
    padding: 20px 20px;
  }

const DIALOGUES = {"姜萊_星群": [{"s": "星群", "t": "姜萊，其實在更早的時候我就愛你，我從頭到尾都愛你。只是我根本不明白自己究竟想要什麼，也不知道自己的公式要求的是什麼答案，我一直害怕一段親密關係，像我父母一樣走到萬劫不復的地步，所以我遲疑，我猶豫，我逃避，我拒絕。可是後來我才想明白，不是每一段感情都會那樣，或許只是因為他們從一開始就並不相愛。\n\n而現在我知道了我要什麼，我也知道你要什麼——你想要的，絕對的真誠，100分的愛。"}, {"s": "姜萊", "t": "就像你說的，原來我愛別人的方式，就是我希望被愛的方式。我曾不為人知地、隱蔽地愛你。等我終於釋懷時你卻開始愛上我了。我當時對你的好都是認真的，對你的愛都是真誠的。\n\n星群，你坐過雲霄飛車嗎？我玩過一次之後快被嚇死了。那種從高空迅速墜落所帶來的失重感讓我心慌害怕，但是這種感覺在我遇見你以後一次又一次地出現。所以你說，愛到底帶給我的是什麼？\n\n我現在真的相信，你也一樣愛我了。在過去的時間裡，我們都愛過對方，卻從未在同一時間相愛過。"}, {"s": "星群", "t": "姜萊，我用被懲罰的幾年，百分百確定也驗證了我對你的喜歡，不是一時半會的心血來潮，是越來越確定的心之所向。你是偏愛，是例外，是首選，也是唯一。\n\n我想告訴你，從前的完治不配擁有莉香的愛。如果你願意再給我一次機會，現在的完治，肯定和莉香很合適。"}], "姜萊_李天樂": [{"s": "姜萊", "t": "李天樂，對不起。\n\n比起你，我好像自私很多。我沒有了解過你到底是個怎樣的人，你過去的經歷，你的遭遇，你過得快樂與否，我好像從沒有對你好奇，也沒有那種恨不得在某一刻把自己二十幾年的人生，濃縮成一部電影講給你聽的衝動。\n\n所以後來你開口要結束這段關係時，我反而感受到一種莫名的輕鬆。可能我的確不是一個好的戀人吧。\n\n我從沒意識到我也在無可避免地傷害著別人，故意也好，無心也罷，甚至有時是用我曾經受過傷害的方式。可當我意識到這一點的時候，我再反省和道歉都是沒有意義的，我從前厭惡星群，而我變成了星群。\n\n你對我那麼好，我卻從來沒有對等地回報你的愛。"}, {"s": "李天樂", "t": "姜萊，有人對你好是因為你值得，不是因為要你還他什麼。這世上沒有一樣情分能還清，愛情裡就注定彼此相欠，虧欠是愛的方式和特權。\n\n我從不為發生的事而後悔，我永遠毫不遲疑地向前看。\n\n或許我認識你的時機不是那麼剛好，我甚至偶爾有點後悔，明明我的店門口也有一棵梧桐樹，如果你進的是咖啡廳而不是那家酒吧呢？或者明明就隔著一條街，明明很多次經過那間酒吧，我卻從來沒走進去過，如果我進去，是不是能早點認識你，或許我們之間就有另一種可能。\n\n這些話，我本來想慢慢爛在心裡，可我的確真切認真地愛過你。姜萊，我也想對你說對不起，我怪你放不下星群，介意你心裡一直有一個別人。可是我漸漸也意識到了，我們誰都有在對方身上投射一些別人的影子。我最喜愛的電影是《情書》，我一直覺得，在你和星群的故事裡，我是渡邊博子。"}, {"s": "姜萊", "t": "而在你和杜綿的故事裡，你是藤井樹，我又何嘗不是渡邊博子。其實，你不用道歉，沒有誰是誰的替身，你只是喜歡同一類人，我們都被影響著，慢慢變成了記憶中喜歡那個人的樣子。"}], "李天樂_杜綿": [{"s": "杜綿", "t": "所以，你也是真的喜歡我的對嗎？那為什麼你也從來不說呢？"}, {"s": "李天樂", "t": "那時候的我不夠強大，給不了你任何東西，許不下任何承諾，自己也還一團糟。無論我多麽努力地奔向你，可從一開始，我其實就偏離了軌道。\n\n可是你有你的軌道，我明明知道你那麼艱難地在追逐你的夢想，愛一個人就像愛一隻鴿子，鴿子越飛我會越難過，但還是希望牠能越飛越高。我已經掉隊了，我不能阻擋你，我也經歷了很長時間才慢慢被迫接受我們之間已經錯過的事實。\n\n在遇見姜萊之前，我也認識過別的女孩，也曾經差一點就要確認關係了。但是那一瞬間我就在想，如果你突然回來了，我該怎麼辦？那一刻我才意識到，如果哪天你願意回來，我肯定是選你，那對那個女孩子來說實在是太不公平了。我不想也不忍心傷害她，所以最後還是拒絕了。\n\n可我以為失去了還可以回來，後來，我知道了我只會在原地等待，我的猶豫與顧慮讓我早就已經失去你了。"}, {"s": "杜綿", "t": "李天樂，再見到你的一瞬間，我變得聽不見自己的呼吸。我們靜默而立，站著客客氣氣打招呼的那一刻，我真的特別想告訴你，我喜歡過你很久很久，久到我都不知道有多久了，我喜歡你。\n\n李天樂，我曾經以為我是《情書》裡的男藤井樹，我的暗戀無法宣之於口，現在我才明白，原來我也是女藤井樹。如果你也愛我，那麼在我們錯過的時間裡，我的猶豫不值得同情，你也是。"}], "劉白_周可一": [{"s": "劉白", "t": "你後悔和我相遇嗎？"}, {"s": "周可一", "t": "如果兩個人不可能有結局，相遇的意義是什麼？"}, {"s": "劉白", "t": "什麼是結局？相愛就是結局。\n\n我們無法預測未來如何，但可以把握當下。任何事情也不是必須有結果才有意義。"}, {"s": "周可一", "t": "不是的，結局才是最重要的。\n\n我小時候看過的電視劇裡都說相愛抵萬難，可我長大了才逐漸明白，有些問題就是解決不了的。\n\n如果某天你能真的懂我，我想要你知道，曾經有段時間，比起任何東西，我寧願你在我身邊；比起世上所有的誘惑，我寧願你在我身邊。"}, {"s": "劉白", "t": "可你一次次地放棄我，我真很想問你，你真的愛過我嗎？"}, {"s": "周可一", "t": "愛，當然愛。就是因為太愛，才會有期待，就會有愧疚。\n\n我很現實，我很自私，我也很惡劣，我無法自洽，更不知道如何拉自己一把。我這個人確實挺奇怪的，我可以理解我和你的戀愛為什麼不能善終了。我極度缺乏安全感，我的敏感需要陪伴，我好像不適合喜歡誰，我的口是心非一次次把我喜歡的人推開，我根本不會愛人。\n\n或許我們注定是不一樣的人。你有你的自由，我有我的束縛，我們彼此失去，這就是為什麼我們要相遇。"}], "星群_杜綿": [{"s": "星群", "t": "你現在後悔來到這裡嗎？"}, {"s": "杜綿", "t": "不後悔。你呢？"}, {"s": "星群", "t": "我也不後悔。如果你沒有得到一個好結果呢？"}, {"s": "杜綿", "t": "我也不知道我期待的好結果究竟是什麼。十年聽起來很長，但其實風一吹就只剩下回憶了，時間會沖淡一切，原本以為念念不忘的人和事也許在記憶的偏差裡也會漸行漸遠。\n\n或許年少時的感情對於大多數男人而言，都是一段不會回頭的旅程吧。"}, {"s": "星群", "t": "如果我們都失敗了，希望你最後找到的人是你自己。或許時間從來都不是記憶的對手，無悔就行。"}, {"s": "杜綿", "t": "那我祝你成功。"}, {"s": "星群", "t": "不管結局如何，我請你喝酒。"}], "姜萊_杜綿": [{"s": "姜萊", "t": "我曾經以為李天樂對我是一見鐘情，我也一直相信，現在我才知道，他的一見鐘情也是有原因的，他或許只是把對你的虧欠都補償到了我身上。"}, {"s": "杜綿", "t": "我們好像都從來沒有真正了解過李天樂。瞭解他的喜好厭惡、他的秉性脾氣、他所有過去的經歷，甚至是他的家庭、他的家人。其實他才是最可憐的人，愛他的人丟下他，而他選擇的人，並不愛他。"}, {"s": "姜萊", "t": "你相信嗎，我曾經已經決定去愛李天樂了。"}, {"s": "杜綿", "t": "姜萊，我們不是靠意志和決定而愛上一個人的。\n\n愛不是決定要去愛，愛是不由自主的。不是「我決定愛上他」，也不是「我會努力愛上他」，也不是「我能愛」，而是，「我不能不愛」。"}, {"s": "姜萊", "t": "誰的心裡都可能曾經有一個放不下的人，我和他都曾透過對方看到過另一個人。我跟他都該愧疚，愛情，是屬於勇敢者的，我們都不勇敢。"}, {"s": "杜綿", "t": "可是你忘了，姜萊，不止對李天樂，這對星群也同樣不公平，你該問問你自己的心，你到底要的是什麼，你到底愛誰？如果你像星群一樣後知後覺，發現自己愛上了李天樂，那麼我祝福你。\n\n他真的很好，即使自己也經受過苦難還是努力對這個世界溫暖，我愛他，拋開所有男女之間的悸動，我依然愛他，所以我同樣希望他幸福，即使那個人不是我。\n\n可如果你愛星群，那我希望你不要逃避地做出你的選擇，不要用李天樂來迴避正視你自己的情感。"}], "周可一_杜綿": [{"s": "周可一", "t": "你挺勇敢的，我很羨慕你。愛情是屬於勇敢者的。"}, {"s": "杜綿", "t": "我比你想得懦弱得多，我的勇敢是後知後覺的，人都沒有上帝視角，我也無法確定對方的心意，我也害怕自己是自作多情。\n\n其實我覺得，我跟你是一樣的人，任何事情總會想得特別多，我們總在擔憂、總在自尊心作祟，擔憂著失去愛的當下，其實我們都沒有在好好愛。"}, {"s": "周可一", "t": "你說得對，可是好好愛也會沒有結果的，人終究還是活在凡塵俗世的，誰又能逃得過一個結果呢？"}, {"s": "杜綿", "t": "那你就把每一天當成最後一天，把當下的戀愛談好，感受愛的這一刻。那麼不管未來如何，你們曾經那麼熾熱地愛過，就夠了，否則會像我一樣後悔。其實劉白考慮的地方不比你少，他知道你們有很多地方不合適，可他還是選擇緊握你的手，為什麼你不再努力一次，就非要證明給他看你們走不下去呢？你真的要再一次拋下他嗎？"}], "周可一_星群": [{"s": "周可一", "t": "星群，對不起，你的投資，短期內很難拿回來了。"}, {"s": "星群", "t": "你的憂鬱症⋯⋯"}, {"s": "周可一", "t": "在吃藥。"}, {"s": "星群", "t": "周可一，這下你是真的有病了。你要記住這個世界沒有不帶傷的人，無論什麼時候，你都要相信，真正能治癒自己的，只有自己。所以不管你遭遇了什麼，都請你接納全部的自己。\n\n有什麼大不了的，未來能有多艱難？俱樂部虧就虧了，大不了我把酒吧賣了給你支撐。"}, {"s": "周可一", "t": "你沒有酒能活嗎？"}, {"s": "星群", "t": "我有姜萊就夠了。你說你怎麼偏偏跟我一個德行呢？"}, {"s": "周可一", "t": "星群，要說攤開自己內心的傷痕，說出自己一切的想法，真的好難，我也討厭自己，卻又無能為力。"}, {"s": "星群", "t": "那你和劉白的感情你到底又在怕什麼呢？"}, {"s": "周可一", "t": "我不怕等，我也不怕愛錯人，但我怕一條一眼望不到盡頭的路，我不知道自己該不該走下去。我知道自己是敏感脆弱的，總是會一遍遍地去想我和他有沒有結局，我才能擁有安全感，失去比擁有更踏實。我知道我很卑劣，我權衡利弊，我被現實左右，可我已經29歲了，我沒時間拉扯了。"}, {"s": "星群", "t": "其實權衡利弊是很正常的事情，沒必要一直指責自己。如果你覺得和劉白在一起需要你自己聲嘶力竭地和全世界對抗，那麼就算了。\n\n但如果你愛他，他也依舊愛你，那麼我告訴你，雖然我的經驗很失敗，但一段愛情不分手其實很簡單，兩個人都放下情緒，坦誠一些，相信對方可以陪你一起找到解決的方法。這才是更需要勇氣的選擇。"}, {"s": "周可一", "t": "那你呢，你想明白自己想要什麼了嗎？"}, {"s": "星群", "t": "在遇見姜萊之前，任何人都覺得我總是給人不遠不近、有距離的感覺，而姜萊是最靠近過我的人。我要的很簡單，我要姜萊，比起任何人，我都更需要她。"}, {"s": "周可一", "t": "那麼，你就該盡全力，讓你自己盡可能地值得被她喜歡。"}, {"s": "星群", "t": "如果她肯回頭，我什麼都願意。"}], "周可一_姜萊": [{"s": "周可一", "t": "姜萊，你還記得星群生日的那天嗎？其實那天，我們從酒吧出來的時候，他就已經看到了你。你在路口坐了多久，他就在你身後不遠的地方看了你多久。那晚他自己一個人去了海邊，吹了一夜的海風，待到天亮才回去。\n\n那時我不理解他為什麼這麼糾結、為什麼推開你，我當時說他有病，他說他知道。直到現在我才明白，我跟他這樣的人，注定都是這樣的性格，可我在他身邊看得清清楚楚，他愛你，那麼你呢，你還愛星群嗎？"}, {"s": "姜萊", "t": "他以前總是讓我覺得不遠不近，充滿了距離感，哪怕竭盡全力，好像都沒有真正靠近過他。我會單曲循環一首歌，直到聽膩為止。我會經常去同一家餐廳，直到吃膩為止。我會偏執地喜歡一個人，直到他不值得。\n\n後來，與其說是不愛，不如說是我想要放過自己了。\n\n可現在，我也開始看不清自己的心，我知道星群對我是一道坎。但我自己甚至也不知道自己有沒有邁過去。"}, {"s": "周可一", "t": "那你愛李天樂嗎？"}, {"s": "姜萊", "t": "我也不知道，對於李天樂，談愛，我甚至覺得自己很卑鄙。"}, {"s": "周可一", "t": "姜萊，作為星群的朋友，我希望你能給他一次機會，我比誰都知道，你是全世界最適合星群的人，我也比誰都知道，他真的很需要你。"}], "劉白_李天樂": [{"s": "劉白", "t": "你對杜綿，現在是什麼樣的感情呢？"}, {"s": "李天樂", "t": "我也說不清楚。我一直在想，如果當初的自己能夠更有勇氣一點。是不是我跟她就不會白白錯過。但一切都沒有如果，就像我們都只會原地等待，我的猶豫與顧慮讓我早就已經失去她了。\n\n有人說，人永遠不能同時擁有青春和對青春的感受。很多事情都是失去了才發現很重要，把握當下才是最正確的，或許離別久了，已經不適合重逢了。"}, {"s": "劉白", "t": "但愛情，不是像下雨打把傘就能躲開的，每個人的相遇、重逢都不是巧合。人和人的緣分，不是一場不出門就可以避開的雨，該遇見時，總會遇見。該回來時，也總會回來的。\n\n她在倫敦過得並不如意，被搶包的那次，那麼危險她都沒有放開那個破舊的包，我一直不明白。後來發現有你存在的時候，我才知道，她不鬆手，是因為那個包裡有你手寫送給她的那份地圖。\n\n李天樂，她的喜歡一定超過你，勇氣也是，而你只是一個膽小鬼。"}], "周可一_李天樂": [{"s": "李天樂", "t": "我們兩個好像並沒有什麼需要聊的。"}, {"s": "周可一", "t": "如果要談點什麼，那我問你一個問題：如果你注定跟一個人沒結果，而你又特別喜歡這個人，你是要過程還是轉身就走？"}, {"s": "李天樂", "t": "你得先想明白你想要什麼結果？什麼叫結果？\n\n太過在意反而適得其反，也許路的盡頭是什麼從來都不重要。人生在世，無論你活成什麼樣子，都會有人對你指指點點。所以永遠不要被別人的眼光牽絆，自己的心意才是最重要的。"}, {"s": "周可一", "t": "那麼你自己的心意呢？兩段感情，先後順序，你的問題比我的難，我回答不了。\n\n看清楚自己的心，再做選擇吧，別辜負任何一個勇敢的人。"}], "星群_李天樂": [{"s": "星群", "t": "如果你了解曾經的姜萊，你就知道，現在的姜萊根本不是她自己。可你喜歡上的姜萊，卻是一個很像杜綿的姜萊，你在她的身上是否投射過杜綿的影子，只有你自己心裡才能分辨清楚了。"}, {"s": "李天樂", "t": "星群，我們誰也別用一種自虐的方式製造出痴情的假象，也別站在感情的道德制高點上。\n\n我曾經也跟你是同一種人，懦弱逃避，但其實這樣的自我感動的情感，是沒人能承載這一切的。\n\n我曾經就想，如果有一天遇到你，我真的好想告訴你，我們兩個都是失敗者，可你更不如我。什麼都買不到那個愛你的女孩仰著頭看你時閃爍在眼眸裡的光。"}, {"s": "星群", "t": "所以我想明白了，我回來了，我們就誰都別選擇迴避，總要做出選擇。"}, {"s": "李天樂", "t": "可是星群，《東京愛情故事》裡，完治有自己的關口里美，莉香現在也有她的。"}], "劉白_姜萊": [{"s": "劉白", "t": "星群跟我說過一句話，他說愛不是尋找一個完美的人，而是學會理解和認同，懂得付出和包容，以及必要的尊重，愛是用完美的眼光，去欣賞那個並不完美的人。他說理解是愛的同義詞。周可一不完美，星群也同樣是，所以，你會選他嗎？"}, {"s": "姜萊", "t": "選擇是一件很容易做的事嗎？那麼你的選擇又是什麼？"}, {"s": "劉白", "t": "有什麼好糾結的？愛誰就選誰，這不是最簡單的事嗎？既然放不下，索性放下所有的體面和尊嚴，選擇不顧一切地去愛，直到愛意耗盡。"}, {"s": "姜萊", "t": "你不會覺得這樣太卑微了嗎？"}, {"s": "劉白", "t": "我覺得你們這些人都好奇怪，想的總比做的多。這不是卑微，也不是傻，這是敢於重新再來一次的勇氣。\n\n人生這道選擇題怎麼選都會有遺憾，那就選自己心裡閉眼第一時間想到的那個人就行了。"}, {"s": "姜萊", "t": "緣分的事情，誰能說得清楚。我曾經就讓自己卑微到塵埃裡，一次又一次地放下自己的尊嚴。或許不需要耗盡愛意，其實人與人之間在相遇的那一刻，緣分就耗盡了。"}, {"s": "劉白", "t": "我不相信緣分，我只信事在人為。"}], "劉白_杜綿": [{"s": "杜綿", "t": "劉白，該抓住的時候盡全力抓住才行，別像我一樣總是在錯過。不要被動，不要羞於先開口挽回，好像誰先開口誰就輸了一樣。愛情裡面沒有輸贏，勝利者也是輸家。所以，不妨主動一點，愛都是有賞味期限的。"}, {"s": "劉白", "t": "我不確定什麼是愛的賞味期，也不確定什麼才叫愛，我只知道我願意陪著她，我今天願意為她做的事情明天依舊願意做，我只希望她別再放棄。或許以後某一天我會嘲笑自己此時的天真吧，但我不會後悔此時此刻的決絕，哪怕所有人都認為它是愚蠢的。"}, {"s": "杜綿", "t": "那就祝我們倆，都能有不留遺憾的結局。"}, {"s": "劉白", "t": "可是，杜綿，我希望你記住，你身後還有一個Daniel（丹尼爾）。有時候回頭看看身邊的人，也未嘗不可啊。"}], "劉白_星群": [{"s": "星群", "t": "我一直覺得，外表上看起來你比周可一小，但實際上你比她成熟。"}, {"s": "劉白", "t": "所有人都覺得我幼稚，只有你說我成熟。"}, {"s": "星群", "t": "你的成熟是打破現實的另一種高度，我和周可一都被困在俗世太久了，反而更需要你這樣的成熟，以我對她的了解，她對你是真心的愛。"}, {"s": "劉白", "t": "其實我不是成熟，抑或者說我不是脫離了現實的人，我只是好奇那些活在現實裡的人他們的選擇就一定是對的嗎？\n\n或許我無法成人的標誌，是我像小孩子一樣，固執地認為一定有比現實更重要的東西，或者說沒有什麼不能改變的現實。\n\n如果必須要我接受那套現實的價值觀，那麼我寧可永遠都這麼幼稚。"}]};

房裡很安靜，外面沒有蟬鳴，我靠在你身邊，我說『好像要下雨了』，你說『對啊，下完雨就涼快了』。那一刻我覺得，這好像就是我原本想要的舒服愜意的夏天。或許我後知後覺，或許我直到此刻還沒有完全想清楚我自己的內心，可我會想明白的，不會太久。」\n\n他笑了笑，轉頭對你說：「我會等，今天這70%的偏向，我值得等。」\n\n節目組的遊輪開始鳴笛，你們也要回到船上繼續航行了。", "jl_lt_mutual_李天樂": "導演讓你們自主選擇要去旅行的地方，可對於你和姜萊來說，沒有什麼比威海更合適的地方了。\n\n下船的時候，姜萊對你說：「以前，我從未去了解你的喜好厭惡、你的秉性脾氣、你過去所有的經歷，甚至是你的家庭、你的家人。這裡是你的家鄉，我想從這裡開始了解你的一切。你帶我去看看吧。」\n\n你們開啟了在威海的一日旅行，這個對她來說陌生、對你來說很熟悉的城市，連風都那麼溫柔。你帶她去了你從小生長的街道，看了你曾經讀書的學校，吃了你愛吃的小吃，一路講述你的故事、你喜歡的顏色、你愛喝的咖啡、你喜歡的味道……所有的一切，你有時間慢慢講給她聽。\n\n最後，你們坐在一個可以觀賞日落的台階上，天邊染成了她最愛的藍調時刻，你們一起吃著冰淇淋，她忽然問你：「對你來說，到底什麼是愛呢？」\n\n你思考了一會，看著她的眼睛說：「我覺得愛是保護對方的孤獨。就比如你一個人坐著畫畫，而我陪你看太陽西沉、雲卷雲舒。等你回過頭的時候，我給你遞杯咖啡，跟你說我今天遇到的有趣的事，告訴你外面下雨了，告訴你有兩隻蠢笨的貓撞在了透明的玻璃上，說我想起你，一個人在傻笑。以前我是不明白的，我們相處得很舒適，曾經很多個瞬間我都誤以為我們是親密的，以至於一遍遍確認你心裡還有星群的時候，一向好脾氣的我，才會不知緣由地憤怒、不甘，我從未看見過這樣的自己，所以我覺得害怕。後來我慢慢才明白，愛不是占有，也不是強行追求什麼，愛就是簡簡單單地保護對方的孤獨。」\n\n她的眼淚落下來，這好像是她第一次為你掉眼淚，她說：「我昨天翻看了我們的合照，我才發現很多時候照片裡都看不見你的正臉，因為在那些照片裡，你的頭都側著，眼神都落在了我的臉上。李天樂，或許有人會覺得我們之間的這段感情充斥著『替身文學』的意思，但其實在《情書》那部電影中，我更高興看到的是渡邊博子鼓起勇氣探索關於男藤井樹的一切。可在我心裡，一切都要次於雪山下博子一聲聲的吶喊『你好嗎？我很好！』最重要的是渡邊博子在最後有了釋懷的能力。」\n\n你幫她擦乾眼淚，聲音越發輕柔：「當然會有人覺得博子是女藤井樹的替身，可我認為博子和男藤井樹是互相愛著的。或許當初一見鍾情的時候，男藤井樹的確有在博子身上發現一些和曾經那個人的相似之處，但在和博子慢慢相處的過程中，男藤井樹一定已經漸漸愛上了她。博子那麼好，又怎麼會有人不喜歡她呢？」\n\n她忽然很神秘地說：「李天樂，我想告訴你一個秘密。」她從包裡拿出厚厚一疊卡片，那是你寫給她的小詩，足足100張，原來每一張她都小心翼翼地收藏起來了。\n\n她說：「想想我應該是愛你的，是在哪一刻決定要愛上你的呢？我記得那是一個陰天的下午，你在客廳裡整理你的東西。我忽然睏意上頭，跑到書房的小沙發上翻開本書窩了一會兒。那裡比較暗，很適合睡覺，迷迷糊糊的時候，我忽然感覺到你走進來輕輕地往我身上蓋了一層毯子，你的聲音很委屈，你說『我以為你不見了』。那天，書房裡很安靜，外面沒有蟬鳴，我靠在你身邊，我說『好像要下雨了』，你說『對啊，下完雨就涼快了』。那一刻我覺得，這好像就是我原本想要的舒服愜意的夏天。或許我後知後覺，或許我直到此刻還沒有完全想清楚我自己的內心，可我會想明白的，不會太久。」\n\n你笑了笑，轉頭告訴她：「我會等，今天這70%的偏向，我值得等。」\n\n節目組的遊輪開始鳴笛，你們也要回到船上繼續航行了。", "dm_lt_mutual_杜綿": "導演讓你們自主選擇要去旅行的地方，可對於你和李天樂來說，沒有什麼比威海更合適的地方了，你們哪裡也不需要去，你們只需要留在原地，因為早在原地，你們就曾經愛過彼此了。\n\n你們走在威海的街道，這個你們從小一起生長的城市，對你們彼此來說完全不會陌生。那天你們去了很多地方，那條你們相遇的街道，那個遇見李天樂的學校，還有你們一起看過《情書》的咖啡店，彷彿所有的一切都在，時光慢慢倒回到以前，回到你和李天樂共同擁有的時間。這一次，威海和你們都不趕時間。\n\n可是，那間咖啡店早已經換成了一家餐廳，你們之間缺失的十年改變的不只是威海的面貌，還有你們的心。\n\n你們站在那家絲毫看不出往日面貌的咖啡店門口，李天樂看著你，忽然說起了那一年，他總是在你下班走夜路回家時遠遠地跟在你的身後，路很黑，車輛也少，他想確保你能夠安全到家。他說你人瘦瘦小小的，走起路可快了，心無旁騖，壓根兒不看周圍的人。他說有個男 。後來我勉強打開手機，才發現我能聯繫的人竟然只有Daniel。我顫顫巍巍地撥通他的電話，是他趕來餵給我麵包和糖吃。我還記得我害怕，但我不敢哭，我呼吸不上來，是他輕輕拍我的後背，才讓我緩過勁來，後來，他時常帶著甜食把我空空如也的冰箱填滿，會在我不知道向誰求助時，毫不猶豫地出現在我身邊。但我挺卑鄙的，我不想要Daniel的愛，在英國的時候卻又需要他的陪伴。」\n\n隨著有關Daniel的事不斷湧現，杜綿的聲音也顯得愈發迷惘：「我之前會覺得姜萊很過分，心裡明明還有別人卻又接受李天樂的愛，其實我也是一樣。人都是自私的，我們誰也不高尚。可現在，既然姜萊和李天樂互相是對方70%的偏向，或許，是不是我們也應該放棄了呢？」\n\n是啊，這個世界上每個人都迷茫，陷在執念迷霧裡的人又何止你們兩個。\n\n她接著說：「我跟李天樂一起看過一部電影，叫做《情書》，那年我沒有看完就趴在桌上睡著了，在我心裡，它是一部最難釋懷最遺憾的電影，可是很多年後，我再次看完那部電影，我才意識到為什麼女藤井樹總是感冒，也才看到最後女藤井樹在病床前回答『我很好』的樣子。看到女藤井樹的感冒終於好起來，看到了博子也會嫁給秋葉先生。但我也直到此刻才明白，這部電影雖然說的是遺憾，但在一場場旅途中，在一封封信件中，在一聲聲『我很好』的呼喚中，也在教我們慢慢釋懷。生命中每一段相逢都有它必然的意義，是驚喜，也是難忘。向後看，過去的人已不會再回來，向前看，每秒又會出現新的故事。」\n\n孤單的時候總會期待著別人的陪伴，這無可厚非，可是你真的不甘心，你已經錯過了她一次，隨後在沒有她的日子裡，用孤單鑄成了牢籠，這一次，你更不願自私地自我安慰要學著接受遺憾。\n\n你站起身來，像是對杜綿說，又像是在對自己下一個無比肯定的決心，你說：「不行。我試過了，無法釋懷，因為我曾經傷害過姜萊，所以現在她做的一切選擇，包括她的70%給了李天樂這件事，我統統都能理解，但我不能接受。愛是獨一、唯一、僅此一個，在我的人生故事裡，姜萊是唯一的主角，我無法克制，愛是自我限制，我也別無選擇，早已固執地把自己死死套牢了。我不會再犯同樣的錯了，只要她願意給我機會。哪怕只有30%的機會，我也不會放棄，我也會堅持到底。她以前學著赤名莉香一樣問我『如果我在喜馬拉雅山上給你打電話，你會來接我嗎』，在冰島時我回答過，會。可曾經的星群，把姜萊的愛丟在了喜馬拉雅山上，而我對自己的心靈苦旅，正是對這個問題最好的回答。」\n\n你看向杜綿：「那妳呢？妳要再次逃避？」\n\n她嘆了口氣：「我不知道，面對困難的時候，我總是習慣性地想逃，我也不明白自己到底怎麼了。或許我還是缺少你的勇氣吧。」\n\n你搖搖頭，對她說：「我也不是天生有勇氣，我的勇氣，也是在真正意識到我或許永遠失去姜萊了以後才生出來的。我還要努力一次，還有30%的機會，走到這裡了，我絕不留一個沒能堅持到底的遺憾。」\n\n她笑了笑，問你：「如果你仍然不被選擇呢？」\n\n你說：「那我去南京的寺廟出家。」\n\n你們都笑了，笑容裡是不是含著苦澀，只有你們自己才知道。節目組的遊輪開始鳴笛，你們也要回到船上繼續航行了。", "zky_lb_mutual_劉白": "導演讓你們自主選擇要去旅行的地方，可對於你和周可一來說，你們必須從威海回到南京，問題在南京，就該在南京解決。這四年時間，你們之間分分合合，經歷了很多尋常情侶所沒有經歷過的全部波折，但時至今日，你們的70%依舊選擇給了對方，沒有比這更幸福的事了。\n\n你帶周可一回到南京，回到了她的射箭俱樂部，你遞給她一把弓，你們並肩站立，你問她：「你想想，你最開始想射箭，究竟是因為什麼呢？」\n\n她沒有回答，你繼續說：「周可一，在你的射箭生涯中，有更強的對手當然讓人失落，可比起贏得這場比賽，比賽帶給你的應該是人生的前路還有無限可能，是你在追逐別人的時候逐漸成了從來無法想像的自己，這才是更大的幸事。為了登上競技體育的最頂峰，的確只有極少數的天才可以被挑選，但競技體育永遠不缺遺憾，鬱鬱不得志的人太多了，收獲與付出之間從來都不是等號，金牌只有一枚，遺憾才是常態，探索、努力、突破、堅持，然後樂在其中，沒有人會永遠做主角，也沒有人會永遠都贏，世界的盡頭都是遺憾，學會接受遺憾和享受熱愛帶來的快樂，才是你的初衷不是嗎？你還記得在倫敦的時候嗎？你果斷，你決絕，你肆意輕快，你有強大到可怕的行動力，周可一，在倫敦的時候那不是你偽裝的自己，那也是一部分的你。」\n\n她嘆了口氣，什麼也沒說，坐了下來。\n\n你坐在她身邊，開始緩緩訴說你藏在心裡許久的事：「周可一，你的憂鬱症，在上節目之前我就已經發現了，你說你的維他命錠是為了提高免疫力，那幾天南京的冬天忽冷忽熱，我也經常鼻塞咳嗽，就想到也吃兩片維他命錠預防一下，可從你藥瓶中倒出的白色藥片和我以往吃的維他命完全不同。我偷偷拿走一片去藥局詢問，其實那時候我心裡已經隱隱有了不祥的擔憂。可當藥劑師告訴我，那是治療憂鬱症的藥物，我如受五雷轟頂，我才猛地想起很多事，也才把很多看似細微的情節聯繫在一起。我明白了為什麼很多我想帶你去的活動你都喪失興趣，為什麼你越來越安靜，為什麼你總是憂心忡忡、愁眉苦臉，為什麼你脾氣越來越不穩定，為什麼你食欲越來越差，我才後怕，我明明一直在你身邊，卻還是不夠了解你。我以為我們沒什麼秘密，卻不知道，你一個人心裡承受了那麼多。當天晚上，我查了很多重型憂鬱症的表現，上面說患者會出現悲觀厭世、絕望、幻覺妄想甚至伴有嚴重的自殺企圖，你知道當我看到那幾個字的時候，我有多害怕嗎？」\n\n周可一的身子微微發抖，拿著弓箭的指節微微發白，眼裡是不可置信的疑惑。\n\n你接著說：「我想起之前你每次接完家裡電話之後總會情緒低落，會變得歇斯底里，於是我決定去你家看看，我想告訴他們你得了憂鬱症，想跟他們聊一聊。可我從你家裡出來的時候，才敢好好喘一口氣，我才坐了半個小時，就快憂鬱了，我無法想像你是如何面對他們的。我才知道，你的焦慮，你的壓力，或許都是來自原生家庭。可他們不覺得自己在打壓你，甚至以愛的名義。他們永遠不可能完全理解你的感受，他們不懂站在你的角度思考，所以你沒必要把他們傷害你的話當真，也不要試圖去改變，你永遠不可能改變他們，因為他們受限於自己的時代背景和觀念，你要做的應該是遠離，以免造成更大的傷害。你要做的是愛自己，不是徹底擺爛，而是希望你的人生和未來都取決於當下的每一刻。那個時候我就知道了，要想讓你好起來，必須要幫你擺脫原生家庭，如果我們在南京，你恐怕始終脫離不了家庭的影響。」\n\n你拿出兩張讀研的offer，遞給她：「這就是你看到的我郵箱裡的申請書，只不過，是兩份，我的和你的。周可一，我能想到的唯一辦法是帶你出國。我把我們現在住的房子賣了，透過原來大學的教授辦好了倫敦學校的手續，我也租下了一間雙人小公寓，我想著一切都安排妥當之後，就告訴你這個消息，我想無論發生什麼，我們都不再分開。」\n\n你轉過身子，扶起她的肩膀：「你以前問我什麼是自由，那時候我說首先是快樂，其次都是其次。我後來也時常在想，究竟什麼才算自由。一開始我覺得內心有牽絆讓身體變得沉重，靈魂應當在外面的世界才能獲得自由的，成為自己，就是自由。我期待每一天的月亮，我想去更高的山峰、更遠的天涯騎車，拍照，吹風，繼續解鎖生命中更多的不可能。慢慢的我理解了，身邊的一切都是自己喜歡的就是自由，和喜歡的人在一起就是自由。我的自由是和你一起，任何束縛你的，我都可以和你一起承擔，只要你別放棄。我曾經以為溝通是關鍵，直到現在我意識到理解才是關鍵。」\n\n她的聲音顫抖，似乎用盡了最後的勇氣。她說：「劉白，你總是看上去傻傻的，但是你很有能力，磁場特別強大，你永遠都相信自己，在你心裡好像就沒有過不去的坎，你會按照自己的節奏過想要的生活。你好像堅信，只要自己積極面對，一切都會迎刃而解。你始終能帶給我正向能量，而我所背負的負能量，從來都不是你造成的。或許星群說得對，你是最適合我的人，因為你自始至終是一個自帶光芒的人。謝謝你靠近我、溫暖我、治癒我。我依舊是個糟糕的戀人，敏感又矯情，習慣說反話，總是提分手，其實後退的每一步都在渴望被人拉著。」\n\n你拉起她的手：「那麼，只要你願意，我就可以陪你面對一切。我必須要承認是我更需要你，人與人之間來回的試探、辜負與不信任裡，總得有一個人來終止這些懲罰，這是愛發生的必要條件。我需要你，我不能失去你，你能不能不要離開我？」\n\n你們故事已經書寫了70%，而最重要的30%，應該由你們共同來寫了。你真的很想和一個人一直一直在一起，真的想每年身邊都是同一個人，那人能陪你走好久好久好久。節目組的通知準時發來，你們也要回到船上繼續航行了。", "zky_lb_mutual_周可一": "導演讓你們自主選擇要去旅行的地方，可對於你和劉白來說，你們必須從威海回到南京，問題在南京，就該在南京解決。這四年時間，你們之間分分合合，經歷了很多尋常情侶所沒有經歷過的全部波折，但時至今日，你們的70%依舊選擇給了對方，沒有比這更幸福的事了。\n\n劉白帶你回到南京，回到了你的射箭俱樂部，他遞給妳一把弓，你們並肩站立，他問你：「你想想，你最開始想射箭，究竟是因為什麼呢？」\n\n你想了很久，好像你最開始學射箭的時候並不是希望射箭將來能帶給你什麼，其實不過是因為你真的喜歡而已。\n\n見你沒有回答，他繼續說：「周可一，在你的射箭生涯中，有更強的對手當然讓人失落，可比起贏得這場比賽，比賽帶給你的應該是人生的前路還有無限可能，是你在追逐別人的時候逐漸成了從來無法想像的自己，這才是更大的幸事。為了登上競技體育的最頂峰，的確只有極少數的天才可以被挑選，但競技體育永遠不缺遺憾，鬱鬱不得志的人太多了， // ===== STATE =====
let myChar = null, myPlayerName = '', selectedChar = null;
let currentMomentIndex = -1, myScores = {}, hasSubmittedThisMoment = false, _lastMomentForReset = -1;
let myMoonChoice = null, moonPartyRound = 1, moonUnsubscribe = null;
let myJourneyChoice = null;
let myFinalChoice = null;
let myLcChoice = {};

// ===== SESSION =====
function saveSession() {
  if (myChar) localStorage.setItem('nl3_session', JSON.stringify({ char: myChar, name: myPlayerName }));
}
function loadSession() {
  try { return JSON.parse(localStorage.getItem('nl3_session')); } catch { return null; }
}

// ===== CHAR GRID =====
function initCharGrid() {
  const grid = document.getElementById('charGrid');
  grid.innerHTML = '';
  Object.entries(CHARACTERS).forEach(([name, data]) => {
    const card = document.createElement('div');
    card.className = 'char-card'; card.id = 'char_' + name;
    card.innerHTML = `<img src="${data.img}" alt="${name}" loading="lazy"><div class="char-name-overlay"><span>${name}</span></div>`;
    card.onclick = () => selectChar(name);
    grid.appendChild(card);
  });
}
function selectChar(name) {
  if (document.getElementById('char_' + name).classList.contains('taken')) return;
  document.querySelectorAll('.char-card').forEach(c => c.classList.remove('selected'));
  selectedChar = name;
  document.getElementById('char_' + name).classList.add('selected');
  document.getElementById('confirmCharBtn').disabled = false;
}
window.confirmCharacter = async function() {
  const name = document.getElementById('playerNameInput').value.trim();
  if (!name) { showToast('請輸入你的名字'); return; }
  if (!selectedChar) { showToast('請選擇角色'); return; }
  myPlayerName = name;
  const snap = await get(ref(db, 'players/' + selectedChar));
  if (snap.exists() && snap.val().online) { showToast('此角色已被選走'); return; }
  myChar = selectedChar;
  saveSession();
  if (snap.exists() && snap.val().scores) myScores = snap.val().scores;
  await set(ref(db, 'players/' + myChar), { name: myPlayerName, char: myChar, online: true, scores: myScores });
  enterGame();
};

// ===== SESSION RESUME =====
async function tryResumeSession() {
  const session = loadSession();
  if (!session) return false;
  try {
    const gameSnap = await get(ref(db, 'gameState'));
    const playerSnap = await get(ref(db, 'players/' + session.char));
    if (!gameSnap.exists() || !playerSnap.exists()) { localStorage.removeItem('nl3_session'); return false; }
    const gs = gameSnap.val();
    if (gs && gs.phase === 'closed') { localStorage.removeItem('nl3_session'); return false; }
    myChar = session.char; myPlayerName = session.name;
    myScores = playerSnap.val().scores || {};
    await update(ref(db, 'players/' + myChar), { online: true, name: myPlayerName });
    enterGame();
    return true;
  } catch(e) { localStorage.removeItem('nl3_session'); return false; }
}

function enterGame() {
  document.getElementById('waitingCharImg').src = CHARACTERS[myChar].img;
  document.getElementById('waitingCharName').textContent = myChar;
  showScreen('screen-waiting');
  startListening();
  setupPresence();
  requestWakeLock();
}

// ===== 上線狀態（防止切 App 被誤判離線）=====
function setupPresence() {
  if (!myChar) return;
  update(ref(db, `players/${myChar}`), { online: true });
  try { onDisconnect(ref(db, `players/${myChar}/online`)).set(false); } catch(e){}
}

// ===== 螢幕保持喚醒 =====
let wakeLock = null;
async function requestWakeLock() {
  try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch(e){}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    requestWakeLock();
    if (myChar) update(ref(db, `players/${myChar}`), { online: true }); // 切回前景重新標記上線
  }
});

// ===== LISTENERS =====
function startListening() {
  onValue(ref(db, 'players'), (snap) => {
    const players = snap.val() || {};
    updatePlayerDots(players);
    Object.keys(CHARACTERS).forEach(name => {
      const card = document.getElementById('char_' + name);
      if (!card) return;
      if (players[name] && players[name].online && name !== myChar) card.classList.add('taken');
    });
  });
  onValue(ref(db, 'gameState'), (snap) => {
    if (!snap.exists()) return;
    handleGameState(snap.val());
  });
  onValue(ref(db, 'gameState/momentIndex'), (snap) => {
    const idx = snap.val();
    if (idx !== null && idx !== undefined && idx !== _lastMomentForReset) {
      hasSubmittedThisMoment = false; _lastMomentForReset = idx;
    }
  });
}

function updatePlayerDots(players) {
  const container = document.getElementById('playersStatus');
  if (!container) return;
  container.innerHTML = '';
  Object.keys(CHARACTERS).forEach(name => {
    const div = document.createElement('div');
    div.className = 'player-dot';
    const isOnline = players[name] && players[name].online;
    div.innerHTML = `<div class="dot ${isOnline?'online':''}"></div><div class="dot-label">${name}</div>`;
    container.appendChild(div);
  });
  const onlineCount = Object.values(players).filter(p => p && p.online).length;
  const txt = document.getElementById('waitingStatusText');
  if (txt) txt.textContent = onlineCount >= 6 ? '所有玩家已就位，等待主持人開始...' : `等待其他玩家加入... (${onlineCount}/6)`;
}

// ===== GAME STATE HANDLER =====
function handleGameState(state) {
  const phase = state.phase || 'waiting';
  const momentIndex = state.momentIndex ?? -1;
  const locked = state.locked || false;
  const revealedGroup = state.revealedGroup || null;

  if (phase === 'closed') {
    localStorage.removeItem('nl3_session');
    if (moonUnsubscribe) { moonUnsubscribe(); moonUnsubscribe = null; }
    myChar = null; myPlayerName = ''; selectedChar = null; myScores = {};
    myMoonChoice = null; moonPartyRound = 1; myJourneyChoice = null; myFinalChoice = null;
    myLcChoice = {}; hasSubmittedThisMoment = false; currentMomentIndex = -1; _lastMomentForReset = -1;
    initCharGrid(); showScreen('screen-select'); showToast('主持人已關閉遊戲'); return;
  }
  if (phase === 'waiting') { showScreen('screen-waiting'); return; }
  if (phase === 'scoring') {
    currentMomentIndex = momentIndex;
    const moment = MOMENTS[momentIndex];
    if (myScores[moment] !== undefined) hasSubmittedThisMoment = true;
    showScoringScreen(momentIndex, locked); return;
  }
  if (phase === 'reveal') { showRevealScreen(state); return; }
  if (phase === 'ecg') { showEcgScreen(revealedGroup); return; }
  if (phase === 'lovechoice') { showLoveChoiceScreen(state); return; }
  if (phase === 'lovechoice_result') { showLoveChoiceResult(state); return; }
  if (phase === 'moonparty') { showMoonPartyScreen(state); return; }
  if (phase === 'moonparty_reveal') { showDialogueScreen(state); return; }
  if (phase === 'journey') { showJourneyScreen(state); return; }
  if (phase === 'journey_reveal') { showJourneyNarrative(state); return; }
  if (phase === 'final') { showFinalScreen(state); return; }
  if (phase === 'final_reveal') { showEndingScreen(state); return; }
}

function showEcgScreen(revealedGroup) {
  const myGroup = CHARACTERS[myChar].group;
  if (revealedGroup && revealedGroup !== 'all' && revealedGroup !== myGroup) {

    document.getElementById('waitingStatusText').textContent = '等待主持人公布你的心電圖...';

  const revealedDiv = document.getElementById('revealedScores');
  revealedDiv.innerHTML = '';
  MOMENTS.forEach(m => {
    const score = myScores[m];
    if (score !== undefined) {
      const chip = document.createElement('div');
      chip.className = 'moment-score-chip';
      chip.innerHTML = `<div class="chip-moment">${m}</div><div class="chip-score">${score}</div>`;
      revealedDiv.appendChild(chip);
    }
  });
  drawEcg();
}
function drawEcg() {
  const canvas = document.getElementById('ecgCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle='rgba(201,168,76,0.1)'; ctx.lineWidth=1;
  for(let i=0;i<=5;i++){const y=40+(H-80)*(i/5);ctx.beginPath();ctx.moveTo(50,y);ctx.lineTo(W-20,y);ctx.stroke();}
  for(let i=0;i<=4;i++){const x=50+(W-70)*(i/4);ctx.beginPath();ctx.moveTo(x,30);ctx.lineTo(x,H-30);ctx.stroke();}
  ctx.fillStyle='rgba(168,192,214,0.7)'; ctx.font='11px sans-serif'; ctx.textAlign='center';
  MOMENTS.forEach((m,i)=>{ctx.fillText(m.replace('時刻',''),50+(W-70)*(i/4),H-10);});
  ctx.textAlign='right';
  [0,25,50,75,100].forEach(v=>{ctx.fillText(v,44,40+(H-80)*((100-v)/100)+4);});
  const pts=MOMENTS.map((m,i)=>{const s=myScores[m]??null;if(s===null)return null;return{x:50+(W-70)*(i/4),y:40+(H-80)*((100-s)/100),score:s};}).filter(Boolean);
  if(pts.length<2)return;
  ctx.beginPath();ctx.strokeStyle='#f0d080';ctx.lineWidth=2.5;ctx.shadowColor='rgba(240,208,128,0.6)';ctx.shadowBlur=8;
  ctx.moveTo(pts[0].x,pts[0].y);
  for(let i=0;i<pts.length-1;i++){const p0=pts[i],p1=pts[i+1],midX=(p0.x+p1.x)/2,amp=Math.abs(p1.y-p0.y)*0.3+10;ctx.bezierCurveTo(midX-(midX-p0.x)*0.3,p0.y-amp,midX-(p1.x-midX)*0.3,p1.y-amp,p1.x,p1.y);}
  ctx.stroke();ctx.shadowBlur=0;
  pts.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,5,0,Math.PI*2);ctx.fillStyle='#f0d080';ctx.shadowColor='rgba(240,208,128,0.8)';ctx.shadowBlur=12;ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='rgba(240,208,128,0.9)';ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.fillText(p.score,p.x,p.y-14);});
}

async function chooseMoonPhase(phaseKey, phaseName) {

window.chooseJourney = async function(choiceKey) {

async function showJourneyNarrative(state) {
  const snap = await get(ref(db, 'journey'));
  const choices = snap.exists() ? snap.val() : {};
  choices['星群'] = choices['星群'] || 'xq';
  choices['杜綿'] = choices['杜綿'] || 'lt';
  const textKey = resolveJourneyKey(myChar, choices);
  if (!textKey) { showScreen('screen-waiting'); document.getElementById('waitingStatusText').textContent = '等待主持人公布旅行結果…'; return; }
  const text = JOURNEY_TEXTS[textKey];
  showScreen('screen-journey-narrative');
  document.getElementById('journeyNarrativeTitle').textContent = '最後的旅行 · ' + myChar;
  document.getElementById('journeyNarrativeBody').textContent = text || '文本準備中…';
}
function resolveJourneyKey(char, choices) {
  // 姜萊(jl): 'lt'(和李天樂) / 'xq'(和星群)；李天樂(lt): 'jl'(和姜萊) / 'dm'(和杜綿)
  // 杜綿固定→李天樂；星群固定→姜萊。四人結果只由 jl、lt 決定。
  const jl=choices['姜萊'], lt=choices['李天樂'], zky=choices['周可一'], lb=choices['劉白'];
  // ── 周可一 × 劉白（獨立配對）──
  if (char==='周可一'||char==='劉白') {
    if (zky==='lb'&&lb==='zky') return `zky_lb_mutual_${char}`;          // 互選
    if (lb==='zky'&&zky!=='lb') return `lb_chose_zky_rejected_${char}`; // 劉白選周可一，被拒
    if (zky==='lb'&&lb!=='zky') return `zky_chose_lb_rejected_${char}`; // 周可一選劉白，被拒
    return `both_reject_${char}`;                                       // 兩人都不去
  }
  // ── 四人組：姜萊 / 李天樂 / 杜綿 / 星群 ──
  const jlLt = (jl==='lt' && lt==='jl');  // 姜萊×李天樂互選
  const ltDm = (lt==='dm');               // 李天樂×杜綿互選
  const jlXq = (jl==='xq');               // 姜萊×星群互選
  if (char==='姜萊') {
    if (jlLt) return 'jl_lt_mutual_姜萊';
    if (jlXq) return 'jl_xq_mutual_姜萊';
    return 'jl_xq_forced_姜萊';            // 姜萊選李天樂但落空，與星群同行
  }
  if (char==='李天樂') {
    if (jlLt) return 'jl_lt_mutual_李天樂';
    if (ltDm) return 'dm_lt_mutual_李天樂';
    return 'dm_lt_forced_李天樂';          // 李天樂選姜萊但落空，與杜綿同行
  }
  if (char==='星群') {                     // 星群一心向姜萊
    if (jlXq) return 'jl_xq_mutual_星群';  // 姜萊也選星群 → 互選
    if (jlLt) return 'dm_xq_forced_星群';  // 姜萊李天樂互選 → 星群杜綿皆沒被選
    return 'jl_xq_forced_星群';            // 姜萊選李天樂落空 → 姜萊星群沒互選但同行
  }
  if (char==='杜綿') {                     // 杜綿一心向李天樂
    if (ltDm) return 'dm_lt_mutual_杜綿';  // 李天樂也選杜綿 → 互選
    if (jlLt) return 'dm_xq_forced_杜綿';  // 姜萊李天樂互選 → 杜綿星群皆沒被選
    return 'dm_lt_forced_杜綿';            // 李天樂選姜萊落空 → 李天樂杜綿沒互選但同行
  }
  return null;
}

  '周可一': [{ key:'lb',  text:'劉白',   icon:'🌙', cls:'person' }, { key:'solo', text:'獨自離去', icon:'🌙', cls:'solo' }],
  '李天樂': [{ key:'dm',  text:'杜綿',   icon:'🎻', cls:'person' }, { key:'jl', text:'姜萊', icon:'🎨', cls:'person' }, { key:'solo', text:'獨自離去', icon:'🌙', cls:'solo' }],
  '姜萊':   [{ key:'lt',  text:'李天樂', icon:'☕', cls:'person' }, { key:'xq', text:'星群', icon:'🌊', cls:'person' }, { key:'solo', text:'獨自離去', icon:'🌙', cls:'solo' }],
  '星群':   [{ key:'jl',  text:'姜萊',   icon:'🎨', cls:'person' }, { key:'solo', text:'獨自離去', icon:'🌙', cls:'solo' }],
  '杜綿':   [{ key:'lt',  text:'李天樂', icon:'☕', cls:'person' }, { key:'solo', text:'獨自離去', icon:'🌙', cls:'solo' }],
};
const FINAL_KEY_TO_CHAR = { zky:'周可一', lb:'劉白', dm:'杜綿', jl:'姜萊', lt:'李天樂', xq:'星群' };
function showFinalScreen(state) {
  showScreen('screen-final');
  const content = document.getElementById('finalContent');
  const opts = FINAL_OPTIONS[myChar];
  if (myFinalChoice || state.locked) {
    const chosen = opts.find(o=>o.key===myFinalChoice);
    content.innerHTML = `<div class="submitted-state"><div class="big-score" style="font-size:22px;letter-spacing:5px;">${chosen?chosen.text:'已選擇'}</div><div class="submitted-label">已送出 · 等待主持人公布結局</div></div>`;
    return;
  }
  content.innerHTML = `<div class="final-options">${opts.map(o=>`<div class="final-option ${o.cls}" onclick="chooseFinal('${o.key}')"><span class="fo-icon">${o.icon}</span>${o.text}</div>`).join('')}</div>`;
}
window.chooseFinal = async function(choiceKey) {
  const opts = FINAL_OPTIONS[myChar];
  const chosen = opts.find(o=>o.key===choiceKey);
  if (!confirm(`確定選擇「${chosen.text}」嗎？`)) return;
  myFinalChoice = choiceKey;
  await set(ref(db, `finalChoice/${myChar}`), choiceKey);
  document.getElementById('finalContent').innerHTML = `<div class="submitted-state"><div class="big-score" style="font-size:22px;letter-spacing:5px;">${chosen.text}</div><div class="submitted-label">已送出 · 等待主持人公布結局</div></div>`;
  showToast('選擇已送出');
};
async function showEndingScreen(state) {
  const snap = await get(ref(db, 'finalChoice'));
  const choices = snap.exists() ? snap.val() : {};
  const myChoice = myFinalChoice || choices[myChar];
  const partnerName = myChoice && myChoice!=='solo' ? FINAL_KEY_TO_CHAR[myChoice] : null;
  let isMutual = false;
  if (partnerName) {
    const partnerChoice = choices[partnerName];
    const myKey = Object.keys(FINAL_KEY_TO_CHAR).find(k=>FINAL_KEY_TO_CHAR[k]===myChar);
    isMutual = partnerChoice === myKey;
  }
  if (!isMutual) { showScreen('screen-no-match'); return; }
  const pair = [myChar, partnerName].sort().join('_');
  const endingKeyMap = { '姜萊_星群':'姜萊_星群', '姜萊_李天樂':'姜萊_李天樂', '杜綿_李天樂':'杜綿_李天樂', '周可一_劉白':'周可一_劉白' };
  const endingKey = endingKeyMap[pair] || endingKeyMap[pair.split('_').reverse().join('_')];
  const dialogue = ENDING_TEXTS[endingKey];
  showScreen('screen-ending');
  document.getElementById('endingPair').textContent = myChar + '  ×  ' + partnerName;
  if (!dialogue) { document.getElementById('endingBody').innerHTML = '<div style="text-align:center;color:var(--silver);padding:40px;">結局文本準備中…</div>'; return; }
  const body = document.getElementById('endingBody');
  body.innerHTML = '';
  dialogue.forEach((line,i) => {
    const isMe=line.s===myChar, isNarrator=line.s==='旁白';
    const div=document.createElement('div');
    div.className='ending-bubble'+(isMe?' is-me':'')+(isNarrator?' is-narrator':'');
    div.style.animationDelay=(i*0.1)+'s';
    div.innerHTML=`<div class="eb-speaker">【${line.s}】</div><div class="eb-text">${line.t.replace(/\n/g,'<br>')}</div>`;
    body.appendChild(div);
  });
}

// ===== HELPERS =====
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function showToast(msg) {
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

// ===== BOOT =====
initCharGrid();
async function boot() {
  const stateSnap = await get(ref(db,'gameState'));
  if (stateSnap.exists() && stateSnap.val()?.phase === 'closed') {
    localStorage.removeItem('nl3_session');
  }
  const resumed = await tryResumeSession();
  if (!resumed) showScreen('screen-select');
}
boot();
// 注意：不在 beforeunload/pagehide 標記離線——手機切換 App 會誤觸發，導致 GM 看到掉線、角色被釋放。
// 真正斷線由 Firebase onDisconnect 處理；切回前景時 visibilitychange 會重新標記上線。
</script>
