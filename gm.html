<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GM 控制台 · 那一束月光三</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600&display=swap');
  :root { --deep:#08091a; --panel:#0f1535; --border:rgba(201,168,76,0.25); --gold:#c9a84c; --gold-light:#f0d080; --silver:#a8c0d6; --white:#f0f4ff; --green:#4ade80; --red:#f87171; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--deep); color:var(--white); font-family:'Noto Serif TC',serif; min-height:100vh; padding:20px; }
  h1 { text-align:center; font-size:20px; font-weight:300; color:var(--gold-light); letter-spacing:6px; padding:20px 0 10px; border-bottom:1px solid var(--border); margin-bottom:24px; }
  .gm-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; max-width:1100px; margin:0 auto; }
  @media(max-width:700px){ .gm-grid{grid-template-columns:1fr;} }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:20px; }
  .panel-title { font-size:12px; letter-spacing:3px; color:var(--gold); text-transform:uppercase; margin-bottom:16px; padding-bottom:8px; border-bottom:1px solid var(--border); }
  .status-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .status-card { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); border-radius:8px; padding:10px; text-align:center; transition:border-color 0.3s; }
  .status-card.online { border-color:rgba(74,222,128,0.4); }
  .status-card img { width:50px; height:67px; object-fit:cover; border-radius:5px; display:block; margin:0 auto 6px; }
  .status-card .sc-name { font-size:13px; letter-spacing:2px; }
  .status-card .sc-player { font-size:10px; color:var(--silver); margin-top:2px; }
  .status-card .sc-dot { width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,0.2); margin:4px auto 0; }
  .status-card .sc-dot.online { background:var(--green); box-shadow:0 0 6px rgba(74,222,128,0.6); }
  .ctrl-section { margin-bottom:20px; }
  .ctrl-label { font-size:11px; color:var(--silver); letter-spacing:2px; margin-bottom:10px; }
  .btn { display:inline-block; padding:10px 20px; border-radius:30px; border:none; cursor:pointer; font-family:'Noto Serif TC',serif; font-size:13px; letter-spacing:2px; transition:all 0.2s; margin:4px; }
  .btn-gold { background:linear-gradient(135deg,var(--gold),var(--gold-light)); color:#08091a; font-weight:600; }
  .btn-gold:hover { box-shadow:0 4px 20px rgba(201,168,76,0.5); transform:translateY(-1px); }
  .btn-red { background:rgba(248,113,113,0.2); border:1px solid var(--red); color:var(--red); }
  .btn-red:hover { background:rgba(248,113,113,0.35); }
  .btn-outline { background:transparent; border:1px solid var(--border); color:var(--silver); }
  .btn-outline:hover { border-color:var(--gold); color:var(--gold); }
  .btn-green { background:rgba(74,222,128,0.15); border:1px solid var(--green); color:var(--green); }
  .btn-green:hover { background:rgba(74,222,128,0.3); }
  .scores-table { width:100%; border-collapse:collapse; font-size:12px; }
  .scores-table th { color:var(--gold); letter-spacing:2px; font-weight:400; padding:6px 8px; border-bottom:1px solid var(--border); text-align:left; font-size:11px; }
  .scores-table td { padding:8px; border-bottom:1px solid rgba(255,255,255,0.05); color:var(--silver); }
  .scores-table td.score-val { color:var(--gold-light); font-size:16px; font-weight:600; text-align:center; }
  .scores-table td.pending { color:rgba(255,255,255,0.2); text-align:center; font-size:18px; }
  .moment-tabs { display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
  .m-tab { padding:6px 14px; border-radius:20px; border:1px solid var(--border); font-size:11px; letter-spacing:2px; cursor:pointer; color:var(--silver); transition:all 0.2s; background:transparent; font-family:'Noto Serif TC',serif; }
  .m-tab.active { background:var(--gold); color:#08091a; font-weight:600; border-color:var(--gold); }
  .current-state-display { padding:12px 16px; background:rgba(255,255,255,0.03); border-radius:8px; margin-bottom:16px; font-size:12px; color:var(--silver); letter-spacing:2px; }
  .current-state-display strong { color:var(--gold-light); }
  .reveal-groups { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .full-panel { grid-column:1/-1; }
  .divider { height:1px; background:var(--border); margin:16px 0; }
  #gmLog { max-height:120px; overflow-y:auto; font-size:11px; color:var(--silver); letter-spacing:1px; line-height:1.8; }
  .log-entry { padding:2px 0; border-bottom:1px solid rgba(255,255,255,0.04); }
  .log-time { color:rgba(168,192,214,0.5); margin-right:8px; }

  /* Reveal flow notice */
  .flow-notice { font-size:11px; color:rgba(168,192,214,0.5); letter-spacing:1px; margin-top:8px; font-style:italic; }
</style>
</head>
<body>
<h1>⚙ GM 控制台 · 那一束月光三</h1>
<div class="gm-grid">
  <div class="panel">
    <div class="panel-title">玩家狀態</div>
    <div class="status-grid" id="statusGrid"></div>
  </div>
  <div class="panel">
    <div class="panel-title">遊戲控制</div>
    <div class="current-state-display" id="currentStateDisplay">章節：<strong>等待開始</strong></div>

    <div class="ctrl-section">
      <div class="ctrl-label">第一章 · 愛情的心電圖</div>
      <button class="btn btn-gold" onclick="startChapter1()">▶ 開始第一章</button>
    </div>

    <div class="divider"></div>

    <div class="ctrl-section">
      <div class="ctrl-label">評分時刻控制</div>
      <div class="moment-tabs">
        <button class="m-tab" onclick="openMoment(0)">初遇</button>
        <button class="m-tab" onclick="openMoment(1)">告白</button>
        <button class="m-tab" onclick="openMoment(2)">相愛</button>
        <button class="m-tab" onclick="openMoment(3)">分手</button>
        <button class="m-tab" onclick="openMoment(4)">此刻</button>
      </div>
      <button class="btn btn-red" id="lockBtn" onclick="toggleLock()">🔒 鎖定當前時刻</button>
    </div>

    <div class="divider"></div>

    <div class="ctrl-section">
      <div class="ctrl-label">公布對方評分（逐組）</div>
      <div class="reveal-groups">
        <button class="btn btn-outline" onclick="revealScores('A')">公布 周可一 × 劉白</button>
        <button class="btn btn-outline" onclick="revealScores('B')">公布 李天樂 × 姜萊</button>
        <button class="btn btn-outline" onclick="revealScores('C')">公布 星群 × 杜綿</button>
        <button class="btn btn-outline" onclick="revealScores('all')">公布 全部</button>
      </div>
      <div class="flow-notice">玩家會看到「對方給自己的分數」</div>
    </div>

    <div class="divider"></div>

    <div class="ctrl-section">
      <div class="ctrl-label">最終公布心電圖</div>
      <div class="reveal-groups">
        <button class="btn btn-outline" onclick="revealEcg('A')">心電圖 周可一 × 劉白</button>
        <button class="btn btn-outline" onclick="revealEcg('B')">心電圖 李天樂 × 姜萊</button>
        <button class="btn btn-outline" onclick="revealEcg('C')">心電圖 星群 × 杜綿</button>
        <button class="btn btn-green" onclick="revealEcg('all')">🌕 全部心電圖</button>
      </div>
      <div class="flow-notice">玩家會看到自己所有時刻的心電圖折線</div>
    </div>

    <div class="divider"></div>

    <div class="ctrl-section">
      <div class="ctrl-label">第二章 · 還能再愛嗎？</div>
      <div style="display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;">
        <button class="btn btn-outline" onclick="startLoveChoice(1)">開始 第一次</button>
        <button class="btn btn-outline" onclick="startLoveChoice(2)">開始 第二次</button>
        <button class="btn btn-outline" onclick="startLoveChoice(3)">開始 第三次</button>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-gold" onclick="revealLoveChoice(1)">公布 第一次</button>
        <button class="btn btn-gold" onclick="revealLoveChoice(2)">公布 第二次</button>
        <button class="btn btn-gold" onclick="revealLoveChoice(3)">公布 第三次</button>
      </div>
      <div style="margin-top:8px;">
        <button class="btn btn-red" id="lcLockBtn" onclick="toggleLcLock()">🔒 鎖定選擇</button>
      </div>
    </div>

    <div class="divider"></div>

    <div class="ctrl-section">
      <div class="ctrl-label" style="color:var(--red)">危險操作</div>
      <button class="btn btn-red" onclick="closeAndReset()">🚪 關閉並重置遊戲</button>
    </div>
  </div>

  <div class="panel full-panel">
    <div class="panel-title">即時評分總覽</div>
    <table class="scores-table">
      <thead><tr><th>角色</th><th style="text-align:center">初遇</th><th style="text-align:center">告白</th><th style="text-align:center">相愛</th><th style="text-align:center">分手</th><th style="text-align:center">此刻</th></tr></thead>
      <tbody id="scoresBody"></tbody>
    </table>
  </div>

  <div class="panel full-panel" id="lcPanel" style="display:none;">
    <div class="panel-title">還能再愛嗎？· 即時選擇</div>
    <div style="display:flex;gap:20px;flex-wrap:wrap;">
      <div style="flex:1;min-width:200px;">
        <div style="font-size:11px;color:var(--gold);letter-spacing:2px;margin-bottom:10px;">第一次</div>
        <table class="scores-table" id="lcTable1"><thead><tr><th>角色</th><th>選擇</th></tr></thead><tbody></tbody></table>
      </div>
      <div style="flex:1;min-width:200px;">
        <div style="font-size:11px;color:var(--gold);letter-spacing:2px;margin-bottom:10px;">第二次</div>
        <table class="scores-table" id="lcTable2"><thead><tr><th>角色</th><th>選擇</th></tr></thead><tbody></tbody></table>
      </div>
      <div style="flex:1;min-width:200px;">
        <div style="font-size:11px;color:var(--gold);letter-spacing:2px;margin-bottom:10px;">第三次</div>
        <table class="scores-table" id="lcTable3"><thead><tr><th>角色</th><th>選擇</th></tr></thead><tbody></tbody></table>
      </div>
    </div>
  </div>

  <div class="panel full-panel">
    <div class="panel-title">操作記錄</div>
    <div id="gmLog"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, get, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyD_B6x6NowrBi14UHPsMmOz4XuSpRG2Ehg",
  authDomain: "moonlight3-d5038.firebaseapp.com",
  databaseURL: "https://moonlight3-d5038-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "moonlight3-d5038",
  storageBucket: "moonlight3-d5038.firebasestorage.app",
  messagingSenderId: "671539326384",
  appId: "1:671539326384:web:360482295180808abe3a75"
};
const firebaseApp = initializeApp(firebaseConfig);
const db = getDatabase(firebaseApp);

const BASE = "https://seraphina-larp.github.io/Moonlight3-game";
const CHAR_IMGS = {
  '姜萊': BASE+'/%E5%A7%9C%E8%90%8A.jpg',
  '李天樂': BASE+'/%E6%9D%8E%E5%A4%A9%E6%A8%82.jpg',
  '星群': BASE+'/%E6%98%9F%E7%BE%A4.jpg',
  '杜綿': BASE+'/%E6%9D%9C%E7%B6%BF.jpg',
  '周可一': BASE+'/%E5%91%A8%E5%8F%AF%E4%B8%80.jpg',
  '劉白': BASE+'/%E5%8A%89%E7%99%BD.jpg'
};
const CHARACTERS = ['姜萊','李天樂','星群','杜綿','周可一','劉白'];
const MOMENTS = ['初遇時刻','告白時刻','相愛時刻','分手時刻','此刻'];
let isLocked = false;
let currentMomentIndex = 0;

function initStatusGrid() {
  const grid = document.getElementById('statusGrid');
  grid.innerHTML = '';
  CHARACTERS.forEach(name => {
    const card = document.createElement('div');
    card.className = 'status-card'; card.id = 'sc_'+name;
    card.innerHTML = `<img src="${CHAR_IMGS[name]}" alt="${name}"><div class="sc-name">${name}</div><div class="sc-player" id="sc_player_${name}">—</div><div class="sc-dot" id="sc_dot_${name}"></div>`;
    grid.appendChild(card);
  });
}

onValue(ref(db,'players'), (snap) => {
  const players = snap.val() || {};
  CHARACTERS.forEach(name => {
    const p = players[name];
    const dot = document.getElementById('sc_dot_'+name);
    const pname = document.getElementById('sc_player_'+name);
    const card = document.getElementById('sc_'+name);
    if (p && p.online) {
      dot && dot.classList.add('online');
      card && card.classList.add('online');
      if (pname) pname.textContent = p.name || name;
    } else {
      dot && dot.classList.remove('online');
      card && card.classList.remove('online');
      if (pname) pname.textContent = '—';
    }
  });
  updateScoresTable(players);
});

onValue(ref(db,'gameState'), (snap) => {
  const s = snap.val() || {};
  const d = document.getElementById('currentStateDisplay');
  if (!s.phase || s.phase==='waiting') {
    d.innerHTML = '章節：<strong>等待開始</strong>';
  } else if (s.phase==='scoring') {
    const m = MOMENTS[s.momentIndex]||'?';
    const lk = s.locked ? '🔒 已鎖定' : '🔓 開放中';
    d.innerHTML = `章節：<strong>愛情的心電圖</strong> · 時刻：<strong>${m}</strong> · ${lk}`;
    isLocked = s.locked||false;
    currentMomentIndex = s.momentIndex??0;
    document.getElementById('lockBtn').textContent = isLocked ? '🔓 解除鎖定' : '🔒 鎖定當前時刻';
    document.querySelectorAll('.m-tab').forEach((t,i)=>t.classList.toggle('active',i===s.momentIndex));
  } else if (s.phase==='reveal') {
    const m = MOMENTS[s.momentIndex]||'?';
    d.innerHTML = `公布評分：<strong>${m}</strong> · 組別：<strong>${s.revealedGroup}</strong>`;
  } else if (s.phase==='ecg') {
    d.innerHTML = `公布心電圖：<strong>${s.revealedGroup}</strong>`;
  }
});

function updateScoresTable(players) {
  const tbody = document.getElementById('scoresBody');
  tbody.innerHTML = '';
  CHARACTERS.forEach(name => {
    const p = players[name];
    let cells = `<td>${name}</td>`;
    MOMENTS.forEach(m => {
      const score = p && p.scores && p.scores[m];
      cells += score!==undefined ? `<td class="score-val">${score}</td>` : `<td class="pending">·</td>`;
    });
    const tr = document.createElement('tr');
    tr.innerHTML = cells;
    tbody.appendChild(tr);
  });
}

window.startChapter1 = async () => {
  await set(ref(db,'gameState'), { chapter:'ch1_ecg', phase:'scoring', momentIndex:0, locked:false, revealedGroup:null });
  addLog('開始第一章 · 初遇時刻');
};
window.openMoment = async (idx) => {
  await update(ref(db,'gameState'), { phase:'scoring', momentIndex:idx, locked:false, revealedGroup:null });
  addLog('開啟時刻：'+MOMENTS[idx]);
};
window.toggleLock = async () => {
  const nl = !isLocked;
  await update(ref(db,'gameState'), { locked:nl });
  addLog(nl?'鎖定時刻':'解除鎖定');
};
// Reveal partner's score for current moment
window.revealScores = async (group) => {
  const labels = { A:'周可一×劉白', B:'李天樂×姜萊', C:'星群×杜綿', all:'全部' };
  await update(ref(db,'gameState'), { phase:'reveal', revealedGroup:group, momentIndex:currentMomentIndex });
  addLog(`公布評分 [${labels[group]}]：${MOMENTS[currentMomentIndex]}`);
};
// Reveal ECG (final)
window.revealEcg = async (group) => {
  const labels = { A:'周可一×劉白', B:'李天樂×姜萊', C:'星群×杜綿', all:'全部' };
  await update(ref(db,'gameState'), { phase:'ecg', revealedGroup:group });
  addLog(`公布心電圖 [${labels[group]}]`);
};
// ===== LOVE CHOICE GM CONTROLS =====
let lcIsLocked = false;
let currentLcRound = 1;

window.startLoveChoice = async (round) => {
  currentLcRound = round;
  lcIsLocked = false;
  await set(ref(db,'gameState'), {
    chapter: 'ch2_lovechoice',
    phase: 'lovechoice',
    lcRound: round,
    locked: false,
    lcChoices: {}
  });
  document.getElementById('lcPanel').style.display = 'block';
  document.getElementById('lcLockBtn').textContent = '🔒 鎖定選擇';
  addLog(`開始「還能再愛嗎？」第${round === 1 ? '一' : round === 2 ? '二' : '三'}次`);
};

window.revealLoveChoice = async (round) => {
  await update(ref(db,'gameState'), {
    phase: 'lovechoice_result',
    lcRound: round,
    locked: true
  });
  addLog(`公布「還能再愛嗎？」第${round === 1 ? '一' : round === 2 ? '二' : '三'}次結果`);
};

window.toggleLcLock = async () => {
  lcIsLocked = !lcIsLocked;
  await update(ref(db,'gameState'), { locked: lcIsLocked });
  document.getElementById('lcLockBtn').textContent = lcIsLocked ? '🔓 解除鎖定' : '🔒 鎖定選擇';
  addLog(lcIsLocked ? '鎖定選擇' : '解除鎖定');
};

// Listen to loveChoices for all 3 rounds
const CHARS_ORDER = ['姜萊','李天樂','周可一','劉白','星群','杜綿'];
[1,2,3].forEach(round => {
  onValue(ref(db, `loveChoices/round${round}`), (snap) => {
    const choices = snap.val() || {};
    const tbody = document.querySelector(`#lcTable${round} tbody`);
    if (!tbody) return;
    tbody.innerHTML = '';
    CHARS_ORDER.forEach(name => {
      const c = choices[name];
      const label = c === 'stay' ? '不分手' : c === 'leave' ? '分手' : '·';
      const color = c === 'stay' ? 'var(--gold-light)' : c === 'leave' ? '#f87171' : 'rgba(255,255,255,0.2)';
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${name}</td><td style="text-align:center;color:${color};font-weight:600;">${label}</td>`;
      tbody.appendChild(tr);
    });
  });
});

window.closeAndReset = async () => {
  if (!confirm('確定要關閉遊戲？所有玩家將被強制退出，所有資料將清除。')) return;
  await set(ref(db,'gameState'), { phase: 'closed' });
  setTimeout(async () => {
    await remove(ref(db,'gameState'));
    await remove(ref(db,'players'));
  }, 2000);
  addLog('🚪 遊戲已關閉並重置');
};

function addLog(msg) {
  const log = document.getElementById('gmLog');
  const now = new Date().toLocaleTimeString('zh-TW');
  const e = document.createElement('div');
  e.className = 'log-entry';
  e.innerHTML = `<span class="log-time">${now}</span>${msg}`;
  log.insertBefore(e, log.firstChild);
}

initStatusGrid();
addLog('GM 控制台已連線');
</script>
</body>
</html>
